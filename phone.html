<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=450,initial-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>lumen Phone</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   lumen Phone  ·  the screen of the HUD phone (450 x 1018 px)
   ===================================================================== */
:root{--accent:#7cc4ff;--ink:#f5f5f7;--dim:rgba(245,245,247,.68);--faint:rgba(245,245,247,.42);
  --glass:rgba(255,255,255,.12);--glass2:rgba(255,255,255,.18);--stroke:rgba(255,255,255,.16);
  --ease:cubic-bezier(.2,.8,.2,1);--spring:cubic-bezier(.34,1.56,.64,1)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#000}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;user-select:none}
button,input{font:inherit;color:inherit;border:0;background:none;outline:none}
button{cursor:pointer}
img{display:block}
::-webkit-scrollbar{display:none}
#ph{position:absolute;left:0;top:0;width:450px;height:1018px;transform-origin:0 0;overflow:hidden;border-radius:52px;background:#0a0b14}
/* ---------- wallpaper ---------- */
#wall{position:absolute;inset:0;transition:background .6s}
.w-lumen{background:radial-gradient(120% 60% at 15% 0%,#3b5bff,transparent 60%),radial-gradient(120% 60% at 100% 100%,#b56bff,transparent 60%),#0a0b14}
.w-aurora{background:radial-gradient(110% 55% at 85% 0%,#00c2a8,transparent 60%),radial-gradient(120% 60% at 0% 100%,#2b6cff,transparent 62%),#05101a}
.w-sunset{background:radial-gradient(120% 60% at 20% 0%,#ff7a45,transparent 60%),radial-gradient(120% 60% at 100% 100%,#ff2d8a,transparent 60%),#160a12}
.w-mine{background:radial-gradient(120% 60% at 15% 0%,var(--mine),transparent 62%),radial-gradient(120% 60% at 100% 100%,var(--mine2),transparent 60%),#0a0b10}
.w-photo{background:#0a0b10 center/cover no-repeat}
.w-photo::before{content:"";position:absolute;inset:0;background:rgba(0,0,0,.22)}
.app span,.lock .date,.lock .time{text-shadow:0 1px 6px rgba(0,0,0,.35)}
.w-midnight{background:radial-gradient(90% 50% at 50% 0%,#232a44,transparent 70%),#06070b}
#wall::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 40%,rgba(0,0,0,.25))}
/* ---------- layers ---------- */
.scr{position:absolute;inset:0;padding:54px 0 0;display:flex;flex-direction:column;animation:scrIn .42s var(--ease) both}
.scr.back{animation:scrBack .42s var(--ease) both}
@keyframes scrIn{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}
@keyframes scrBack{from{opacity:0;transform:translateX(-28px)}to{opacity:1;transform:none}}
.scr.rise{animation:rise .45s var(--ease) both}
@keyframes rise{from{opacity:0;transform:translateY(40px) scale(.96)}to{opacity:1;transform:none}}
.body{flex:1;overflow-y:auto;overflow-x:hidden;padding:0 22px 92px}
/* ---------- status bar ---------- */
#status{position:absolute;left:0;right:0;top:0;height:50px;display:flex;align-items:center;justify-content:space-between;padding:6px 34px 0 40px;z-index:40;font-size:16px;font-weight:600;letter-spacing:-.01em;cursor:pointer}
#status .r{display:flex;align-items:center;gap:7px}
.sig{display:flex;gap:2px;align-items:flex-end;height:12px}.sig i{width:3px;border-radius:1px;background:#fff}
.bat{position:relative;width:27px;height:13px;border-radius:4px;border:1.6px solid rgba(255,255,255,.55);padding:1.5px}
.bat::after{content:"";position:absolute;right:-4px;top:3.5px;width:2px;height:4px;border-radius:0 1px 1px 0;background:rgba(255,255,255,.55)}
.bat i{display:block;height:100%;border-radius:2px;background:#fff}
.bat.low i{background:#ff453a}.bat.chg i{background:#30d158}
.bolt{width:10px;height:13px;display:none}.chg .bolt,.bolt.on{display:block}
#status .pct{font-size:13px;font-weight:600;opacity:.9}
/* ---------- home bar ---------- */
#homebar{position:absolute;left:50%;bottom:9px;width:150px;height:22px;margin-left:-75px;z-index:45;cursor:pointer;display:flex;align-items:center;justify-content:center}
#homebar i{width:134px;height:5px;border-radius:3px;background:rgba(255,255,255,.88)}
/* ---------- atoms ---------- */
.glass{background:var(--glass);-webkit-backdrop-filter:blur(26px) saturate(160%);backdrop-filter:blur(26px) saturate(160%)}
.hd{display:flex;align-items:center;gap:12px;padding:6px 22px 14px}
.hd h1{font-size:34px;font-weight:800;letter-spacing:-.035em;flex:1}
.bk{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--glass);margin-left:-6px}
.bk svg{width:20px;height:20px}
.round{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--glass)}
.round svg{width:20px;height:20px}
.srch{display:flex;align-items:center;gap:10px;margin:0 22px 16px;height:44px;border-radius:14px;padding:0 14px;background:rgba(255,255,255,.14)}
.srch svg{width:18px;height:18px;opacity:.75;flex-shrink:0}
.srch input{flex:1;font-size:16px;min-width:0}
.srch input::placeholder{color:var(--faint)}
h3{font-size:19px;font-weight:700;letter-spacing:-.02em;margin:18px 0 12px}
h3 small{font-size:13px;font-weight:500;color:var(--faint);margin-left:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{height:36px;padding:0 15px;border-radius:18px;background:rgba(255,255,255,.12);font-size:15px;font-weight:600;transition:background .2s}
.chip.on{background:var(--hot,#ff5f45)}
.pill{display:inline-flex;align-items:center;justify-content:center;gap:9px;height:46px;padding:0 22px;border-radius:23px;font-size:16px;font-weight:700;background:var(--glass2)}
.pill svg{width:20px;height:20px}
.pill.white{background:#f5f5f7;color:#0b0b0e}
.empty{padding:18px;border-radius:18px;background:rgba(255,255,255,.08);color:var(--dim);font-size:15px;line-height:1.45;text-align:center}
.empty b{color:#fff}
.list{display:flex;flex-direction:column;gap:4px}
.li{display:flex;align-items:center;gap:13px;padding:8px 0;text-align:left;width:100%}
.li .th{width:112px;height:63px;border-radius:10px;flex-shrink:0;background:#222 center/cover;position:relative;overflow:hidden}
.li .th.sq{width:58px;height:58px}
.li .tx{min-width:0;flex:1;display:flex;flex-direction:column;gap:3px}
.li b{font-size:15px;font-weight:700;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.li span{font-size:13px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{position:absolute;left:6px;top:6px;padding:2px 7px;border-radius:6px;background:#e91916;font-size:11px;font-weight:800;letter-spacing:.04em}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px 14px}
.card{display:flex;flex-direction:column;gap:7px;text-align:left}
.card .th{aspect-ratio:16/10;border-radius:14px;background:#222 center/cover}
.card b{font-size:15px;font-weight:700;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card span{font-size:13px;color:var(--dim)}
.toast{position:absolute;left:50%;top:62px;transform:translate(-50%,-20px);opacity:0;z-index:60;padding:11px 18px;border-radius:20px;background:rgba(30,30,36,.92);font-size:14px;font-weight:600;white-space:nowrap;transition:.35s var(--ease);pointer-events:none;max-width:400px;overflow:hidden;text-overflow:ellipsis}
.toast.on{opacity:1;transform:translate(-50%,0)}
/* ---------- lock ---------- */
.lock{align-items:center;padding:110px 26px 0}
.lock .date{font-size:21px;font-weight:500;color:rgba(255,255,255,.88)}
.lock .time{font-size:118px;font-weight:300;letter-spacing:-.055em;line-height:1;margin-top:2px}
.lock .chgline{margin-top:14px;font-size:15px;font-weight:600;color:#30d158;display:flex;gap:6px;align-items:center}
.lock .spacer{flex:1}
.np-card{width:100%;padding:18px;border-radius:26px;display:flex;flex-direction:column;gap:14px;background:rgba(255,255,255,.15)}
.np-card .row{display:flex;gap:14px;align-items:center}
.np-card .art{width:60px;height:60px;border-radius:14px;background:#333 center/cover;flex-shrink:0}
.np-card b{font-size:17px;font-weight:700;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.np-card span{font-size:14px;color:rgba(255,255,255,.75)}
.prog{height:5px;border-radius:3px;background:rgba(255,255,255,.3);overflow:hidden}.prog i{display:block;height:100%;width:0;background:#fff;border-radius:3px}
.ctl{display:flex;justify-content:center;align-items:center;gap:44px}
.ctl button{width:48px;height:48px;display:flex;align-items:center;justify-content:center}
.ctl svg{width:28px;height:28px}
.swipe{margin:22px 0 44px;font-size:14px;font-weight:600;color:rgba(255,255,255,.7);animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
/* ---------- home ---------- */
.home .body{padding-top:6px}
.cw{display:flex;flex-direction:column;gap:4px;padding:16px;border-radius:24px;background:rgba(255,255,255,.13);margin-bottom:26px;text-align:left;width:100%}
.cw small{font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:rgba(255,255,255,.72)}
.cw .row{display:flex;gap:13px;align-items:center;margin-top:8px}
.cw .th{width:92px;height:54px;border-radius:10px;background:linear-gradient(140deg,#ff5f45,#8b0a2e) center/cover;flex-shrink:0;position:relative;overflow:hidden}
.cw .th i{position:absolute;left:0;bottom:0;height:4px;background:#ff5f45}
.cw b{font-size:16px;font-weight:700;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cw span{font-size:13px;color:rgba(255,255,255,.72)}
.apps{display:grid;grid-template-columns:repeat(4,1fr);gap:22px 8px}
.app{display:flex;flex-direction:column;align-items:center;gap:7px;font-size:12.5px;font-weight:500;transition:transform .3s var(--spring)}
.app:active{transform:scale(.9)}
.ico{width:66px;height:66px;border-radius:18px;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 0 0 1px rgba(255,255,255,.22),0 8px 20px rgba(0,0,0,.25)}
.ico svg{width:32px;height:32px}
.dock{position:absolute;left:18px;right:18px;bottom:40px;padding:13px;border-radius:32px;display:flex;justify-content:space-between;background:rgba(255,255,255,.17);-webkit-backdrop-filter:blur(26px);backdrop-filter:blur(26px);z-index:5}
.dock .ico{width:64px;height:64px}
/* ---------- mini player ---------- */
#mini{position:absolute;left:14px;right:14px;bottom:40px;height:64px;border-radius:20px;display:none;align-items:center;gap:12px;padding:0 8px 0 9px;background:rgba(28,28,34,.86);-webkit-backdrop-filter:blur(26px);backdrop-filter:blur(26px);z-index:30;box-shadow:0 10px 30px rgba(0,0,0,.4);cursor:pointer}
#mini.on{display:flex}
#mini .art{width:48px;height:48px;border-radius:11px;background:#333 center/cover;flex-shrink:0}
#mini .tx{flex:1;min-width:0}#mini b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#mini span{font-size:12.5px;color:var(--dim)}
#mini button{width:44px;height:44px;display:flex;align-items:center;justify-content:center}#mini svg{width:24px;height:24px}
/* ---------- players ---------- */
.vid{position:relative;width:100%;aspect-ratio:16/9;background:#000;flex-shrink:0}
.vid iframe,.vid>div{position:absolute;inset:0;width:100%;height:100%;border:0}
.vinfo{padding:16px 22px 6px}
.vinfo b{font-size:20px;font-weight:700;letter-spacing:-.02em;line-height:1.25;display:block}
.vinfo span{font-size:14px;color:var(--dim);display:block;margin-top:5px}
.acts{display:flex;gap:10px;padding:12px 22px 4px;flex-wrap:wrap}
.acts .pill{height:42px;padding:0 17px;font-size:15px}
.chat{flex:1;border:0;width:100%;background:#0e0e10}
/* ---------- now playing ---------- */
.np{padding:60px 30px 0;background:linear-gradient(180deg,var(--g1,#b03a6a) 0%,rgba(30,10,40,.9) 55%,#1a0830)}
.np .top{display:flex;justify-content:space-between;align-items:center;font-size:15px;font-weight:600;color:rgba(255,255,255,.85)}
.np .big{width:100%;aspect-ratio:1;border-radius:26px;margin:20px 0 26px;background:linear-gradient(140deg,#ffd36e,#ff2d6f) center/cover;box-shadow:0 30px 60px rgba(0,0,0,.45)}
.np .t{font-size:27px;font-weight:800;letter-spacing:-.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.np .a{font-size:18px;color:rgba(255,255,255,.72);margin-top:4px}
.np .prog{margin-top:24px}
.np .times{display:flex;justify-content:space-between;font-size:13px;color:rgba(255,255,255,.65);margin-top:8px}
.np .ctl{margin-top:20px;gap:38px}
.np .ctl .pp{width:92px;height:92px;border-radius:50%;background:#fff;color:#111}
.np .ctl .pp svg{width:36px;height:36px}
.np .ctl svg{width:36px;height:36px}
.np .send{margin:26px auto 0;display:flex}
/* ---------- movies ---------- */
.feat{position:relative;width:100%;height:200px;border-radius:24px;overflow:hidden;margin:16px 0 4px;text-align:left;background:linear-gradient(140deg,#ff5f45,#5a1020) center/cover;display:flex;flex-direction:column;justify-content:flex-end;padding:18px}
.feat::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 30%,rgba(0,0,0,.75))}
.feat small,.feat b{position:relative}
.feat small{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#ffb39f}
.feat b{font-size:24px;font-weight:800;letter-spacing:-.02em;margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
/* ---------- settings ---------- */
.sec{border-radius:20px;background:rgba(255,255,255,.09);padding:6px 16px;margin-bottom:18px}
.sec>.lab{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);margin:20px 4px 8px}
.row2{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:54px;border-bottom:1px solid rgba(255,255,255,.08)}
.row2:last-child{border-bottom:0}
.row2 .l{display:flex;flex-direction:column;gap:2px}.row2 .l b{font-size:16px;font-weight:600}.row2 .l span{font-size:13px;color:var(--dim)}
.sw{width:52px;height:32px;border-radius:16px;background:rgba(255,255,255,.2);position:relative;flex-shrink:0;transition:background .2s}
.sw::after{content:"";position:absolute;left:3px;top:3px;width:26px;height:26px;border-radius:50%;background:#fff;transition:left .25s var(--spring)}
.sw.on{background:#30d158}.sw.on::after{left:23px}
.sws{display:flex;flex-wrap:wrap;gap:12px;padding:12px 0}
.swatch{width:42px;height:42px;border-radius:50%;box-shadow:inset 0 0 0 2px rgba(255,255,255,.18);position:relative}
.swatch.on::after{content:"";position:absolute;inset:-5px;border-radius:50%;border:2.5px solid #fff}
.swatch.custom{background:conic-gradient(#ff3b3b,#ffe23b,#5ee35e,#34d4e8,#3b7bff,#a63bff,#ff3bb8,#ff3b3b)}
.swatch input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.seg{display:flex;background:rgba(255,255,255,.1);border-radius:12px;padding:3px;gap:3px;margin:10px 0}
.seg button{flex:1;height:38px;border-radius:9px;font-size:14px;font-weight:600;color:var(--dim)}
.seg button.on{background:rgba(255,255,255,.24);color:#fff}
.walls{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;padding:12px 0}
.walls button{aspect-ratio:9/16;border-radius:10px;position:relative}
.walls button.photo{background:#222 center/cover}
.wpform{display:flex;gap:8px;padding:4px 0 14px}
.wpform input{flex:1;min-width:0;height:42px;border-radius:12px;padding:0 12px;background:rgba(255,255,255,.12);font-size:14px}
.wpform input::placeholder{color:var(--faint)}
.wpform .pill{height:42px;padding:0 16px;font-size:14px}
.walls button.on::after{content:"";position:absolute;inset:-4px;border-radius:13px;border:2.5px solid #fff}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:30px;background:transparent}
input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:4px;background:rgba(255,255,255,.22)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:#fff;margin-top:-9px;box-shadow:0 2px 8px rgba(0,0,0,.4)}
.batbig{display:flex;align-items:center;gap:18px;padding:16px 0}
.batbig .bat{width:76px;height:34px;border-radius:9px;border-width:2.5px;padding:3px}.batbig .bat::after{right:-8px;top:10px;width:4px;height:9px}
.batbig b{font-size:30px;font-weight:800;letter-spacing:-.03em}
/* ---------- controls (pull-down) ---------- */
#cc{position:absolute;inset:0;z-index:50;background:rgba(8,8,14,.55);-webkit-backdrop-filter:blur(30px) saturate(150%);backdrop-filter:blur(30px) saturate(150%);padding:66px 24px 0;transform:translateY(-104%);transition:transform .45s var(--ease);display:flex;flex-direction:column;gap:16px}
#cc.on{transform:none}
.ccgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.tile{border-radius:24px;background:rgba(255,255,255,.13);padding:16px;display:flex;flex-direction:column;gap:10px;text-align:left;min-height:108px;justify-content:space-between}
.tile .ic{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center}
.tile .ic svg{width:22px;height:22px}
.tile b{font-size:15px;font-weight:700}.tile span{font-size:12.5px;color:var(--dim)}
.tile.on{background:#f5f5f7;color:#0b0b0e}.tile.on span{color:rgba(0,0,0,.6)}.tile.on .ic{background:#0b0b0e;color:#fff}
.slid{border-radius:24px;background:rgba(255,255,255,.13);padding:14px 18px;display:flex;align-items:center;gap:14px}
.slid svg{width:24px;height:24px;flex-shrink:0}
.ccnp{border-radius:24px;background:rgba(255,255,255,.13);padding:14px;display:flex;align-items:center;gap:12px}
.ccnp .art{width:52px;height:52px;border-radius:12px;background:#333 center/cover}
.ccnp .tx{flex:1;min-width:0}.ccnp b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ccnp span{font-size:13px;color:var(--dim)}
.cchint{text-align:center;font-size:13px;color:var(--faint);margin-top:6px}
/* ---------- nearby banner ---------- */
#near{position:absolute;left:14px;right:14px;top:12px;z-index:70;border-radius:26px;padding:15px 16px;background:rgba(24,24,30,.9);-webkit-backdrop-filter:blur(30px);backdrop-filter:blur(30px);box-shadow:0 18px 40px rgba(0,0,0,.5);transform:translateY(-140%);transition:transform .5s var(--spring);display:flex;flex-direction:column;gap:12px}
#near.on{transform:none}
#near .row{display:flex;gap:13px;align-items:center}
#near .av{width:46px;height:46px;border-radius:50%;background:linear-gradient(140deg,#7cc4ff,#3b5bff);display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800;flex-shrink:0}
#near small{font-size:12px;color:var(--faint);font-weight:600}
#near b{display:block;font-size:16px;margin-top:1px}#near span{font-size:13.5px;color:var(--dim)}
#near .acts{padding:0;gap:8px}#near .pill{height:38px;font-size:14px;flex:1}
/* ---------- map + radar ---------- */
.mapbox{position:relative;width:406px;height:406px;border-radius:22px;overflow:hidden;background:#1a2a1a center/cover;margin:4px 0 14px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
.mapbox img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.dot{position:absolute;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;border:2.5px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.5)}
.dot.me{width:22px;height:22px;margin:-11px 0 0 -11px;background:#7cc4ff;border-width:3px}
.dot.me i{position:absolute;left:50%;top:-12px;width:0;height:0;margin-left:-5px;border:5px solid transparent;border-bottom:9px solid #fff}
.ring{position:absolute;border-radius:50%;border:2px dashed rgba(124,196,255,.85);background:rgba(124,196,255,.12);pointer-events:none}
.legend{display:flex;gap:16px;font-size:13px;color:var(--dim);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.radar{position:relative;width:340px;height:340px;margin:2px auto 16px;border-radius:50%;background:radial-gradient(circle,rgba(48,209,88,.12),rgba(0,0,0,.3) 70%);box-shadow:inset 0 0 0 1px rgba(255,255,255,.15)}

.near b{color:#7cc4ff}

#sheet{position:absolute;left:0;right:0;bottom:0;z-index:55;border-radius:30px 30px 52px 52px;padding:14px 22px 46px;background:rgba(26,26,32,.96);transform:translateY(105%);transition:transform .45s var(--ease)}
#sheet.on{transform:none}
#sheet .grab{width:40px;height:5px;border-radius:3px;background:rgba(255,255,255,.3);margin:0 auto 16px}
#sheet .who{display:flex;gap:14px;align-items:center;margin-bottom:16px}

async function decapi(path) {

}
async function pool(items, n, fn) { const out = []; let i = 0;
  await Promise.all(Array.from({ length: Math.min(n, items.length) }, async () => { while (i < items.length) { const k = i++; out[k] = await fn(items[k]); } })); return out; }

  const live = (await pool(CFG.live.popular, 6, async n => isLive(await decapi("uptime/" + n)) ? n : null)).filter(Boolean);
  const list = await pool(live.slice(0, 10), 5, async n => { const [title, game, v] = await Promise.all([decapi("title/" + n), decapi("game/" + n), decapi("viewercount/" + n)]); return { name: n, title, game, viewers: +v || 0 }; });

const MV = { last: [] };
const textYear = (title, desc) => { const Y = "(19[2-9]\\d|20[0-3]\\d)";
  const m = title.match(new RegExp("\\b" + Y + "\\b")) || (desc || "").match(new RegExp("\\(" + Y + "\\)|\\b(?:released?|release year|year)\\D{0,12}" + Y + "\\b", "i"));
  const y = m && +(m[1] || m[2]); return y && y <= new Date().getFullYear() ? y : 0; };
const cleanTitle = t => (/full free|maverick/i.test(t) && /"([^"]{2,60})"/.test(t) ? t.match(/"([^"]{2,60})"/)[1] : t.split(/\s+[|•]\s+/)[0]
  .replace(/\s*\((full movie|full film|free)[^)]*\).*$/i, "").replace(/\s*[-–—:]?\s*\bfull (hd )?(movie|film)\b.*$/i, "").replace(/\s*\((19|20)\d\d\)\s*$/, "").replace(/\s{2,}/g, " ").trim()) || t;
async function movieFind(q) {
  const key = "lumenPhone.mv." + q.toLowerCase();
  try { const c = JSON.parse(localStorage.getItem(key) || "null"); if (c && Date.now() - c.t < 3600000) return c.d; } catch (e) {}
  const items = await piped(q, "videos");
  const d = items.filter(x => x.url && /watch\?v=/.test(x.url) && x.duration >= 3000 && CFG.movies.channels[(x.uploaderUrl || "").split("/").pop()])
    .map(x => ({ id: x.url.split("v=")[1].slice(0, 11), title: cleanTitle(x.title || ""), ch: CFG.movies.channels[x.uploaderUrl.split("/").pop()], dur: x.duration, yr: textYear(x.title || "", x.shortDescription) }));
  try { localStorage.setItem(key, JSON.stringify({ t: Date.now(), d })); } catch (e) {}
  return d;
}
function mixLists(lists) { const out = [], seen = new Set(), n = Math.max(0, ...lists.map(l => l.length));
  for (let i = 0; i < n; i++) for (const l of lists) { const m = l[i]; if (m && !seen.has(m.id)) { seen.add(m.id); out.push(m); } } return out; }
let YRS = null;
const yrKey = m => m.title.toLowerCase() + "|" + Math.round((m.dur || 0) / 600);
async function addYears(list) {          // release years from Wikidata (free, no key), matched by running time
  if (!YRS) { try { YRS = JSON.parse(localStorage.getItem("lumenPhone.yrs") || "{}"); } catch (e) { YRS = {}; } }
  const todo = list.filter(m => !m.yr && m.title && !(yrKey(m) in YRS)); const titles = [...new Set(todo.map(m => m.title))].filter(t => t.length > 1 && t.length < 90).slice(0, 60);
  if (titles.length) {
    const vals = titles.map(t => JSON.stringify(t) + "@en").join(" ");
    const q = `SELECT ?l (MIN(YEAR(?d)) AS ?y) (SAMPLE(?len) AS ?min) WHERE { VALUES ?l { ${vals} } ?film rdfs:label ?l; wdt:P31/wdt:P279* wd:Q11424; wdt:P577 ?d. OPTIONAL { ?film wdt:P2047 ?len } } GROUP BY ?l ?film`;
    try { const ctl = new AbortController(); const tm = setTimeout(() => ctl.abort(), 12000);
      const r = await fetch("https://query.wikidata.org/sparql", { method: "POST", signal: ctl.signal, headers: { "Content-Type": "application/x-www-form-urlencoded", "Accept": "application/sparql-results+json" }, body: "query=" + enc(q) });
      clearTimeout(tm);
      if (r.ok) { const rows = (await r.json()).results.bindings.map(b => ({ l: b.l.value.toLowerCase(), y: +b.y.value, min: b.min ? +b.min.value : 0 }));
        todo.forEach(m => { const c = rows.filter(x => x.l === m.title.toLowerCase()), mins = (m.dur || 0) / 60;
          const near = c.filter(x => x.min && Math.abs(x.min - mins) <= 12).sort((a, b) => Math.abs(a.min - mins) - Math.abs(b.min - mins));
          YRS[yrKey(m)] = near.length ? near[0].y : c.length === 1 && !c[0].min ? c[0].y : 0; });
        try { localStorage.setItem("lumenPhone.yrs", JSON.stringify(YRS)); } catch (e) {} }
    } catch (e) {}
  }
  list.forEach(m => { if (!m.yr) m.yr = YRS[yrKey(m)] || 0; }); return list;
}

  <div class="sec"><div class="lab">Charger cable colour · ${esc(nameOf(S.cable))}</div>${swatches(S.cable, "cc")}</div>
  <div class="sec"><div class="lab">Wallpaper</div><div class="walls">${WALLS.map(w => `<button class="w-${w[0]} ${S.wall === w[0] ? "on" : ""}" data-wall="${w[0]}" aria-label="${w[1]}"></button>`).join("")}${S.wp ? `<button class="photo ${S.wall === "photo" ? "on" : ""}" data-wall="photo" style="background-image:url('${esc(S.wp)}')" aria-label="Your picture"></button>` : ""}</div>
    <div style="font-size:14px;font-weight:600;margin-top:4px">Your own picture</div>
    <form class="wpform" data-search="wp"><input placeholder="Paste a picture link (https://…)" value="${esc(S.wp)}"><button class="pill white" type="submit">Set</button>${S.wp ? `<button class="pill" type="button" data-act="wpclear">Remove</button>` : ""}</form>
    <div style="font-size:12.5px;color:var(--dim);padding-bottom:12px;line-height:1.4">Use a direct link to a picture (ends in .jpg, .png, .gif or .webp, or an Imgur / Gyazo / Flickr image link). It's saved in your phone, so it's there every time you wear it.</div></div>
  <div class="sec"><div class="lab">Nearby alerts</div>
    ${sw(S.al, "al", "Nearby alerts", "A banner + chime when someone comes close")}
    <div class="row2" style="flex-direction:column;align-items:stretch;padding:8px 0"><div class="l"><b>Alert me when someone is within</b></div>
      <div class="seg">${[[20, "Chat 20 m"], [100, "Shout 100 m"], [4096, "Region"]].map(r => `<button class="${S.ar === r[0] ? "on" : ""}" data-ar="${r[0]}">${r[1]}</button>`).join("")}</div></div>
    ${sw(S.as, "as", "Play a sound", "When the banner drops in")}
    ${sw(S.alv, "alv", "Alert when they leave", "")}
    ${S.muted.length ? `<button class="row2" data-act="unmuteall" style="width:100%;text-align:left"><div class="l"><b>Muted people</b><span>${S.muted.length} muted · tap to clear</span></div></button>` : ""}</div>
  <div class="sec"><div class="lab">Sound + display</div>
    ${sw(S.quiet, "quiet", "Quiet mode", "No chimes or clicks (the action button toggles it)")}
    <div class="row2"><div class="l" style="flex:1"><b>Brightness</b><input type="range" min="25" max="100" value="${S.bright}" data-range="bright"></div></div>
    <div class="row2"><div class="l" style="flex:1"><b>Volume</b><input type="range" min="0" max="100" value="${S.vol}" data-range="vol"></div></div></div>
  <div class="sec"><div class="lab">Battery</div>${batBig()}
    <button class="row2" data-act="plug" style="width:100%;text-align:left"><div class="l"><b>${CHG ? "Unplug the charger" : "Plug in the charger"}</b><span>Or click the plug under your phone</span></div>${ic(I.plug)}</button>
    <div class="row2"><div class="l"><span>The battery lasts about 6 hours while you wear the phone and charges to full in about 30 minutes.</span></div></div></div>
  <div class="sec"><div class="lab">About</div><div class="row2"><div class="l"><b>lumen Phone ${VERSION}</b><span>Chat /9 menu · /9 hide · /9 charge · /9 pink · /9 cable blue</span></div></div></div>
</div></div>`;

/* ---------- controls pull-down ---------- */
let ccOpen = false;
function drawCC() {
  const t = (on, act, icon, label, sub) => `<button class="tile ${on ? "on" : ""}" data-act="${act}"><span class="ic">${ic(icon)}</span><span><b>${label}</b><br><span>${sub}</span></span></button>`;
  const now = V ? "the video" : M.cur ? M.cur.title : "";
  $("#cc").innerHTML = `
    <div class="slid">${ic(I.vol)}<input type="range" min="0" max="100" value="${S.vol}" data-range="vol" aria-label="Volume"><b style="width:44px;text-align:right">${S.vol}%</b></div>
    <div class="slid">${ic(I.sun)}<input type="range" min="25" max="100" value="${S.bright}" data-range="bright" aria-label="Brightness"><b style="width:44px;text-align:right">${S.bright}%</b></div>
    <div class="ccgrid">
      ${t(S.al, "al", I.bell, "Nearby alerts", S.al ? "On · " + (S.ar === 4096 ? "region" : S.ar + " m") : "Off")}
      ${t(S.quiet, "quiet", I.moon, "Quiet mode", S.quiet ? "On" : "Off")}
      ${t(false, "hide", I.away, "Hide phone", "Slide away")}
      ${t(false, "tvnow", I.tv, "Send to TV", now ? esc(now).slice(0, 22) : "Nothing playing")}
      ${t(CHG, "plug", I.plug, "Charger", CHG ? "Charging · " + BAT + "%" : "Unplugged · " + BAT + "%")}
      ${t(false, "ambient", I.ambient, "Ambient", "Clock screensaver")}
    </div>
    ${M.cur ? `<div class="ccnp"><div class="art" style="background-image:url('${thumb(M.cur.id)}')"></div><div class="tx"><b>${esc(M.cur.title)}</b><span>TubeMusic</span></div><button data-act="mpp" class="js-pp" style="width:44px;height:44px">${ppIcon()}</button><button data-act="mnext" style="width:44px;height:44px">${fillIc(I.next)}</button></div>` : ""}
    <div class="cchint">Click the top bar again or swipe up to close</div>`;
}
function openCC() { if (BAT <= 0 && !CHG) return; drawCC(); ccOpen = true; $("#cc").classList.add("on"); }
function closeCC() { ccOpen = false; $("#cc").classList.remove("on"); }

/* ---------- hardware buttons (from the phone's scripts) ---------- */
let asleep = false;
function hwKey(k) {
  if (k === "power") { asleep = !asleep; $("#sleep").classList.toggle("on", asleep); if (asleep) { vStop(); closeCC(); } else go("lock", {}, true); }
  else if (k === "action") { S.quiet = S.quiet ? 0 : 1; save(); send("q=" + S.quiet); toast(S.quiet ? "Quiet mode on" : "Quiet mode off"); if (ccOpen) drawCC(); }
  else if (k === "home") home();
}
let volT = 0;
function volKey(d) {
  S.vol = Math.max(0, Math.min(100, S.vol + (d === "up" ? 10 : -10))); save(); applyVol();
  const h = $("#volhud"); h.querySelector("i").style.height = S.vol + "%"; h.classList.add("on");
  clearTimeout(volT); volT = setTimeout(() => h.classList.remove("on"), 1500);
}
function applyVol() { try { M.p && M.ready && M.p.setVolume(S.vol); } catch (e) {} try { V && V.setVolume && V.setVolume(S.vol); } catch (e) {} if (ccOpen) { const b = $$("#cc .slid b")[0]; if (b) b.textContent = S.vol + "%"; } }

/* =====================================================================
   clicks + typing
   ===================================================================== */
document.addEventListener("click", e => {
  const t = e.target.closest("button,[data-act],label"); if (!t) { if (ccOpen && !e.target.closest("#cc .slid,#cc .ccgrid,#cc .ccnp")) closeCC(); return; }
  click();
  const d = t.dataset;
  if (d.go) { if (d.go === "settings" || d.go === "map" || d.go === "radar" || d.go === "ambient") go(d.go); else go(d.go, {}); return; }
  if (d.play) { const a = JSON.parse(d.play); go(a.app === "movies" ? "movieplay" : "tubeplay", a); return; }
  if (d.st) { const st = CFG.stations.find(x => x.key === d.st); mPlayList(st.songs.map(row3), 0, st.name); return; }
  if (d.song) { const s = JSON.parse(d.song), list = s.from === "recent" ? S.recentMusic.slice() : lastSongs; mPlayList(list, s.i, s.from === "recent" ? "Recently played" : "Search"); return; }
  if (d.ch) { go("liveplay", { ch: d.ch }); return; }
  if (d.mf) { const a = JSON.parse(d.mf); stack[stack.length - 1] = { name: "movies", arg: a }; render(""); return; }
  if (d.th !== undefined) { const th = CFG.theater[+d.th]; th.app ? go(th.app, {}) : openWeb(th.url); return; }
  if (d.url) { openWeb(d.url); return; }
  if (d.full) { toast("Opening full screen · press the power button to come back", 3000); setTimeout(() => location.assign(d.full), 900); return; }
  if (d.tv) { send("tv=" + enc(d.tv)); toast("Sent to the lumen TV nearby"); return; }
  if (d.who) { const p = PEOPLE.find(x => x.ref === d.who); if (p) personSheet(p); return; }
  if (d.pc) { setPhone(d.pc); return; }
  if (d.cc) { setCableC(d.cc); return; }
  if (d.wall) { S.wall = d.wall; save(); paint(); send("wall=" + d.wall); rerender(); return; }
  if (d.ar) { S.ar = +d.ar; save(); send("ar=" + S.ar); rerender(); return; }
  const a = d.act;
  if (!a) return;
  if (a === "back") { closeSheet(); back(); }
  else if (a === "unlock") go("home", {}, true);
  else if (a === "cont") { const c = S.cont; go(c.app === "movies" ? "movieplay" : "tubeplay", { app: c.app, id: c.id, title: c.title, sub: c.sub }); }
  else if (a === "mpp") mToggle();
  else if (a === "mnext") { if (t.closest("#mini") && !M.cur) return; mNext(); }
  else if (a === "mprev") mPrev();
  else if (a === "msearch") { const cur_ = cur().arg; stack[stack.length - 1] = { name: "movies", arg: { ...cur_, find: cur_.find || "" } }; render(""); setTimeout(() => { const i = $(".srch input"); i && i.focus(); }, 60); }
  else if (a === "al" || a === "as" || a === "alv" || a === "quiet") { S[a] = S[a] ? 0 : 1; save(); send(a === "quiet" ? "q=" + S.quiet : a + "=" + S[a]); if (ccOpen) drawCC(); if (cur().name === "settings") rerender(); }
  else if (a === "hide") { closeCC(); send("hide=1"); }
  else if (a === "plug") { send("plug=1"); }
  else if (a === "ambient") { closeCC(); go("ambient"); }
  else if (a === "tvnow") { const n = cur(); let cmd = ""; if (n.name === "tubeplay" || n.name === "movieplay") cmd = (n.arg.app === "movies" ? "movies " : "tube ") + "https://youtu.be/" + n.arg.id; else if (n.name === "liveplay") cmd = "live " + n.arg.ch; else if (n.name === "web" && n.arg.url) cmd = "web " + n.arg.url; else if (M.cur) cmd = "music https://youtu.be/" + M.cur.id;
    if (cmd) { send("tv=" + enc(cmd)); toast("Sent to the lumen TV nearby"); } else toast("Play something first"); }
  else if (a === "prof") send("prof=" + sheetRef);
  else if (a === "showmap") { closeSheet(); if (cur().name !== "map") go("map"); }
  else if (a === "mutep") { const r = sheetRef, i = S.muted.indexOf(r); if (i < 0) { S.muted.push(r); send("mute=" + r); toast("You won't get alerts about them"); } else { S.muted.splice(i, 1); send("unmute=" + r); } save(); const p = PEOPLE.find(x => x.ref === r) || nearP; if (p) personSheet(p, true); }
  else if (a === "closesheet") closeSheet();
  else if (a === "wpclear") { S.wp = ""; if (S.wall === "photo") S.wall = "lumen"; save(); paint(); send("wall=" + S.wall + "&wp="); rerender(); toast("Wallpaper removed"); }
  else if (a === "unmuteall") { S.muted.forEach(r => send("unmute=" + r)); S.muted = []; save(); rerender(); }
  else if (a === "nradar") { $("#near").classList.remove("on"); go("radar"); }
  else if (a === "nprof") { $("#near").classList.remove("on"); if (nearP) send("prof=" + nearP.ref); }
});
document.addEventListener("input", e => {
  const r = e.target.dataset.range;
  if (r) { S[r] = +e.target.value; save(); if (r === "bright") paint(); else applyVol(); const b = e.target.parentElement.querySelector("b:last-child"); if (b && ccOpen) b.textContent = S[r] + "%"; }
});
document.addEventListener("change", e => {
  const k = e.target.dataset.pick; if (!k) return;
  const h = e.target.value.replace("#", "");
  k === "pc" ? setPhone(h) : setCableC(h);
});
// a picture link → test that it loads, then use it and save it (here + in the phone itself)
function picUrl(raw) {
  raw = raw.trim().replace(/^<|>$/g, "");
  if (!/^https?:\/\//i.test(raw)) raw = "https://" + raw;
  let m;
  if ((m = raw.match(/^https?:\/\/(?:www\.)?imgur\.com\/(?!a\/|gallery\/)([A-Za-z0-9]{5,})$/i))) return "https://i.imgur.com/" + m[1] + ".jpg";
  if ((m = raw.match(/^https?:\/\/gyazo\.com\/([0-9a-f]{20,})$/i))) return "https://i.gyazo.com/" + m[1] + ".png";
  return raw.replace(/^http:/i, "https:");
}
function setWallpaper(raw) {
  const url = picUrl(raw);
  if (url.length > 480) { toast("That link is too long. Try a shorter link to the picture.", 3500); return; }
  toast("Loading the picture…", 6000);
  const img = new Image();
  const t = setTimeout(() => { img.src = ""; toast("That picture took too long to load. Try another link.", 3500); }, 12000);
  img.onload = () => { clearTimeout(t); S.wp = url; S.wall = "photo"; save(); paint(); send("wall=photo&wp=" + enc(url)); rerender(); toast("Wallpaper set · saved in your phone"); };
  img.onerror = () => { clearTimeout(t); toast("Couldn't open that picture. Use a direct image link (.jpg / .png).", 4000); };
  img.src = url;
}
function setPhone(c) { S.color = c; save(); paint(); send("c=" + enc(c)); rerender(); toast("Phone colour: " + nameOf(c)); }
function setCableC(c) { S.cable = c; save(); send("cc=" + enc(c)); rerender(); toast("Cable colour: " + nameOf(c)); }
document.addEventListener("submit", e => {
  const f = e.target.closest("form[data-search]"); if (!f) return; e.preventDefault();
  const app = f.dataset.search, raw = $("input", f).value.trim(); if (!raw) return;
  if (app === "tube") { const id = ytId(raw); id ? go("tubeplay", { app: "tube", id, title: "YouTube video", sub: "" }) : (stack[stack.length - 1] = { name: "tube", arg: { q: raw } }, render("")); }
  else if (app === "music") { const id = ytId(raw); if (id) mPlayList([{ id, title: "YouTube song", sub: "" }], 0, "Link"); else { stack[stack.length - 1] = { name: "music", arg: { q: raw } }; render(""); } }
  else if (app === "live") { const m = raw.match(/twitch\.tv\/([A-Za-z0-9_]{2,40})/); go("liveplay", { ch: (m ? m[1] : raw.replace(/\s+/g, "")).toLowerCase() }); }
  else if (app === "movies") { const id = ytId(raw); if (id) go("movieplay", { app: "movies", id, title: "Movie", sub: "" }); else { stack[stack.length - 1] = { name: "movies", arg: { find: raw } }; render(""); } }
  else if (app === "web") openWeb(webUrl(raw));
  else if (app === "wp") setWallpaper(raw);
});
$("#homebar").addEventListener("click", () => { click(); if (ccOpen) closeCC(); else if (cur().name === "lock") go("home", {}, true); else home(); });
$("#status").addEventListener("click", () => { ccOpen ? closeCC() : openCC(); });
$("#sleep").addEventListener("click", () => hwKey("power"));
$("#mini").addEventListener("click", e => { if (!e.target.closest("button")) go("np"); });

/* swipes: up on the lock screen opens it, down from the top opens the controls, up closes them */
let sx = 0, sy = 0, st = 0;
document.addEventListener("pointerdown", e => { sx = e.clientX; sy = e.clientY; st = Date.now(); }, true);
document.addEventListener("pointerup", e => {
  const k = 1 / scale, dy = (e.clientY - sy) * k, dx = (e.clientX - sx) * k;
  if (Date.now() - st > 900 || Math.abs(dx) > Math.abs(dy)) return;
  const y0 = sy * k;
  if (dy > 70 && y0 < 110 && !ccOpen) openCC();
  else if (dy < -70 && ccOpen) closeCC();
  else if (dy < -80 && cur().name === "lock") go("home", {}, true);
  else if (dy < -60 && $("#near").classList.contains("on") && y0 < 200) $("#near").classList.remove("on");
}, true);

/* fit the 450 x 1018 phone to whatever window shows it */
let scale = 1;
function fit() { scale = Math.min(innerWidth / 450, innerHeight / 1018) || 1; $("#ph").style.transform = `scale(${scale})`; $("#ph").style.left = (innerWidth - 450 * scale) / 2 + "px"; }
addEventListener("resize", fit);

/* ---------- start ---------- */
fit(); paint(); setBattery(BAT, 0); render("rise"); readIn();
if (P.get("demo")) {         // ?demo=1 : fake data, to look at the screens in a normal browser
  REG = { name: "Serenity Lake", gx: 1000, gy: 1000, x: 128, y: 96, face: 90 };
  PEOPLE = [{ ref: "a1", name: "Jaz Praise", d: 14, deg: 80, x: 118, y: 104, mins: 3 }, { ref: "b2", name: "Odee", d: 18, deg: -40, x: 140, y: 110, mins: 12 }, { ref: "c3", name: "Mar Caro", d: 62, deg: 150, x: 100, y: 40, mins: 30 }, { ref: "d4", name: "Yuki", d: 88, deg: 20, x: 200, y: 170, mins: 1 }];
  PCOUNT = 5;
}

</script>
</body>
