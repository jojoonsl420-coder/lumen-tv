<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>lumen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   lumen TV OS  -  Second Life shared-media interface
   Everything scales from the root font size, so it looks identical at
   1280x720, 1920x1080 or any other media size.
   ===================================================================== */
:root{
  --bg:#050507; --text:#f5f5f7; --dim:rgba(245,245,247,.62); --faint:rgba(245,245,247,.38);
  --glass:rgba(255,255,255,.075); --glass-2:rgba(255,255,255,.12); --stroke:rgba(255,255,255,.14);
  --accent:#7cc4ff; --accent-2:#b18cff; --r:1.1rem;
  --ease:cubic-bezier(.2,.8,.2,1); --spring:cubic-bezier(.34,1.56,.64,1);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{font-size:min(1.25vw,2.2222vh);background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter","Segoe UI",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;font-feature-settings:"cv11","ss01","ss03"}
html,body{width:100%;height:100%;overflow:hidden}
body{user-select:none}
button,input{font:inherit;color:inherit;border:0;background:none;outline:none}
button{cursor:pointer}
img{display:block}
::-webkit-scrollbar{display:none}

/* ---------- living wallpaper ---------- */
#wall{position:fixed;inset:0;overflow:hidden;z-index:0;background:
  radial-gradient(120% 90% at 50% 120%,rgba(20,24,40,.9),transparent 60%),var(--bg)}
#wall .blob{position:absolute;width:70rem;height:70rem;border-radius:50%;opacity:.68;
  background:radial-gradient(closest-side,var(--c),transparent 70%);will-change:transform}
#wall .b1{--c:var(--w1,#2b5cff);left:-22rem;top:-30rem;animation:drift1 11s ease-in-out infinite alternate}
#wall .b2{--c:var(--w2,#a23cff);right:-26rem;top:-18rem;animation:drift2 13s ease-in-out infinite alternate}
#wall .b3{--c:var(--w3,#00c2c7);left:8rem;bottom:-46rem;animation:drift3 12s ease-in-out infinite alternate}
#wall .b4{--c:var(--w1,#ff3dbb);right:-10rem;bottom:-40rem;width:55rem;height:55rem;opacity:.45;animation:drift4 9s ease-in-out infinite alternate}
#wall .grain{position:absolute;inset:0;opacity:.07;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
#wall .vignette{position:absolute;inset:0;background:radial-gradient(130% 100% at 50% 40%,transparent 55%,rgba(0,0,0,.65))}
@keyframes drift1{33%{transform:translate(24rem,6rem) scale(1.2)}66%{transform:translate(8rem,22rem) scale(.9)}to{transform:translate(32rem,14rem) scale(1.25)}}
@keyframes drift2{33%{transform:translate(-22rem,20rem) scale(.85)}66%{transform:translate(-6rem,6rem) scale(1.15)}to{transform:translate(-30rem,24rem) scale(.95)}}
@keyframes drift3{33%{transform:translate(26rem,-14rem) scale(1.3)}66%{transform:translate(-10rem,-20rem) scale(1)}to{transform:translate(34rem,-6rem) scale(1.2)}}
@keyframes drift4{50%{transform:translate(-26rem,-18rem) scale(1.25)}to{transform:translate(-44rem,-4rem) scale(.9)}}

#app{position:fixed;inset:0;z-index:1}
.view{position:absolute;inset:0;animation:viewIn .7s var(--ease) both}
body.leaving .view{animation:viewOut .22s ease-in both}
@keyframes viewIn{from{opacity:0;transform:scale(1.035);filter:blur(10px)}to{opacity:1;transform:none;filter:none}}
@keyframes viewOut{to{opacity:0;transform:scale(.975);filter:blur(6px)}}

/* ---------- shared atoms ---------- */
.glass{background:var(--glass);-webkit-backdrop-filter:blur(30px) saturate(170%);backdrop-filter:blur(30px) saturate(170%);
  border:1px solid var(--stroke);box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 1.2rem 3rem rgba(0,0,0,.35)}
.pill{display:inline-flex;align-items:center;gap:.5rem;height:2.6rem;padding:0 1.15rem;border-radius:99rem;
  font-size:.95rem;font-weight:600;letter-spacing:-.01em;transition:transform .35s var(--spring),background .25s,box-shadow .25s}
.pill:hover{transform:scale(1.06);background:var(--glass-2)}
.pill.primary{background:#f5f5f7;color:#0a0a0c;box-shadow:0 .6rem 1.8rem rgba(255,255,255,.18)}
.pill.primary:hover{background:#fff;box-shadow:0 .8rem 2.4rem rgba(255,255,255,.3)}
.pill svg{width:1rem;height:1rem}
.eyebrow{font-size:.78rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.clock{font-size:1.05rem;font-weight:600;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.ver{font-size:.72rem;font-weight:600;color:var(--faint);letter-spacing:.02em}
.together{display:inline-flex;align-items:center;gap:.45rem;font-size:.8rem;font-weight:600;color:var(--dim)}
.together i{width:.5rem;height:.5rem;border-radius:50%;background:#34c759;box-shadow:0 0 .8rem #34c759;animation:breathe 2.4s ease-in-out infinite}
@keyframes breathe{50%{opacity:.35}}

/* ---------- app icons ---------- */
.icon{position:relative;width:100%;aspect-ratio:1;border-radius:23%;overflow:hidden;
  background:linear-gradient(145deg,var(--g1),var(--g2));
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.18),inset 0 -.6rem 1.4rem rgba(0,0,0,.25),0 .9rem 2rem rgba(0,0,0,.45)}
.icon::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.38),rgba(255,255,255,0) 48%);mix-blend-mode:soft-light}
.icon::after{content:"";position:absolute;inset:-40%;background:radial-gradient(circle at var(--mx,50%) var(--my,0%),rgba(255,255,255,.5),transparent 35%);opacity:0;transition:opacity .3s}
.icon svg{position:absolute;inset:22%;width:56%;height:56%;filter:drop-shadow(0 .25rem .5rem rgba(0,0,0,.25))}
.i-tube{--g1:#ff8a5c;--g2:#ff2d6f}
.i-loops{--g1:#1de9d0;--g2:#7a3cff}
.i-live{--g1:#b56bff;--g2:#5b21f5}
.i-music{--g1:#ff4d7a;--g2:#9b1cff}
.i-pulse{--g1:#b6ff3b;--g2:#00b86b}
.i-theater{--g1:#ffd36e;--g2:#ff5a36}
.i-movies{--g1:#ff5f45;--g2:#8b0a2e}
.theme-movies{--accent:#ff5f45}
body.theme-movies #wall{--w1:#e6392b;--w2:#ff8a3d;--w3:#3d0612}
.i-ambient{--g1:#2a3d66;--g2:#0b1022}
.i-web{--g1:#62d2ff;--g2:#1a5cff}
.theme-web{--accent:#4aa8ff}
body.theme-web #wall{--w1:#1a5cff;--w2:#62d2ff;--w3:#0b2a6b}
.urlbar{display:flex;align-items:center;gap:.8rem;margin:1.5rem 4.5rem 2.4rem;height:4.4rem;padding:0 .6rem 0 1.6rem;border-radius:1.4rem;font-size:1.25rem}
.urlbar svg{width:1.4rem;height:1.4rem;opacity:.6;flex:none}
.urlbar input{flex:1;height:100%;font-size:1.2rem;user-select:text;min-width:0}
.urlbar input::placeholder{color:var(--faint)}
.urlbar button{height:3.2rem;padding:0 1.6rem;border-radius:1rem;background:var(--accent);color:#000;font-weight:700;font-size:1rem;transition:transform .3s var(--spring)}
.urlbar button:hover{transform:scale(1.05)}
.recent{display:grid;grid-template-columns:repeat(3,1fr);gap:1.3rem;margin:0 4.5rem 2.4rem}
.rcard{display:flex;align-items:center;gap:1.1rem;padding:1.2rem 1.3rem;border-radius:1.2rem;text-align:left;min-width:0;transition:transform .4s var(--spring),box-shadow .4s}
.rcard:hover{transform:scale(1.04);box-shadow:0 1.4rem 2.6rem rgba(0,0,0,.5),0 0 0 .14rem rgba(255,255,255,.85)}
.rcard .fav{flex:none;width:3rem;height:3rem;border-radius:.8rem;background:rgba(255,255,255,.1);display:grid;place-items:center;overflow:hidden}
.rcard .fav img{width:1.9rem;height:1.9rem}
.rcard .tx{min-width:0}
.rcard b{display:block;font-size:1rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rcard small{display:block;font-size:.76rem;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:.15rem}
.rcard.ghost{opacity:.45;pointer-events:none}
.tt-hero{position:relative;margin:0 4.5rem 2.2rem;border-radius:1.6rem;overflow:hidden;padding:2.4rem 2.6rem;display:flex;align-items:center;gap:2.4rem;
  background:radial-gradient(60% 120% at 0% 0%,rgba(47,243,224,.35),transparent 60%),radial-gradient(60% 120% at 100% 100%,rgba(255,46,147,.35),transparent 60%),rgba(255,255,255,.05);box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
.tt-hero h2{font-size:2.2rem;font-weight:800;letter-spacing:-.035em;line-height:1.05;margin:.4rem 0 .5rem}
.tt-hero p{font-size:.9rem;color:var(--dim);line-height:1.45;max-width:34rem}
.tt-hero .acts{display:flex;gap:.8rem;margin-top:1.2rem}

/* =====================================================================
   HOME
   ===================================================================== */
.home .shelf{position:absolute;left:0;right:0;top:0;height:58%;overflow:hidden;
  -webkit-mask-image:linear-gradient(180deg,#000 84%,transparent);mask-image:linear-gradient(180deg,#000 84%,transparent)}
.shelf .slide{position:absolute;inset:0;opacity:0;transition:opacity 1.1s var(--ease)}
.shelf .slide.on{opacity:1}
.shelf .slide img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scale(1.08);transition:transform 9s linear}
.shelf .slide.on img{transform:scale(1.0)}
.shelf .slide .art{position:absolute;inset:0;background:linear-gradient(135deg,var(--g1,#334),var(--g2,#112))}
.shelf .shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(5,5,7,.88) 0%,rgba(5,5,7,.45) 38%,transparent 70%),linear-gradient(0deg,rgba(5,5,7,.9),transparent 45%)}
.shelf .meta{position:absolute;left:4.5rem;bottom:4.2rem;max-width:34rem}
.shelf .meta h1{font-size:3.1rem;font-weight:700;letter-spacing:-.035em;line-height:1.02;margin:.55rem 0 .6rem;text-wrap:balance}
.shelf .meta p{font-size:1.05rem;color:var(--dim);margin-bottom:1.3rem}
.shelf .dots{position:absolute;right:4.5rem;bottom:4.6rem;display:flex;gap:.4rem}
.shelf .dots i{width:.42rem;height:.42rem;border-radius:1rem;background:rgba(255,255,255,.35);transition:all .5s var(--ease)}
.shelf .dots i.on{width:1.4rem;background:#fff}
.topbar{position:absolute;left:4.5rem;right:4.5rem;top:2.2rem;display:flex;align-items:center;justify-content:space-between;z-index:3}
.wordmark{display:flex;align-items:center;gap:.6rem;font-size:1.25rem;font-weight:700;letter-spacing:-.03em}
.orb-mini{width:1.45rem;height:1.45rem;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#b9e3ff 18%,#6a8cff 45%,#7b2fff 75%,#1a0f3a);box-shadow:0 0 1rem rgba(122,150,255,.7)}
.topbar .right{display:flex;align-items:center;gap:1.4rem}

.dock{position:absolute;left:50%;top:62%;transform:translateX(-50%);display:flex;gap:1.15rem;padding:.95rem 1.35rem .75rem;border-radius:1.7rem;align-items:flex-end}
.app{position:relative;width:5.2rem;perspective:40rem;text-align:center}
.app .tilt{position:relative;transition:transform .22s var(--ease);transform-style:preserve-3d;
  transform:translateY(calc((var(--mag,1) - 1) * -2.4rem)) scale(var(--mag,1)) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transform-origin:50% 100%}
.app:hover{--mag:1.16}
.app .tilt::before{content:"";position:absolute;inset:-28%;border-radius:50%;z-index:-1;opacity:0;transform:scale(.5);
  background:radial-gradient(closest-side,var(--g1,#7aa2ff),transparent 75%);filter:blur(.4rem);transition:opacity .35s,transform .45s var(--spring)}
.app:hover .tilt::before{opacity:.85;transform:scale(1);animation:halo 1.8s ease-in-out .4s infinite}
@keyframes halo{50%{opacity:.45;transform:scale(1.15)}}
.app:hover .icon{box-shadow:inset 0 0 0 1px rgba(255,255,255,.3),0 1.4rem 2.4rem rgba(0,0,0,.55),0 0 0 .15rem rgba(255,255,255,.85)}
.app:hover .icon::after{opacity:1}
.app:hover .icon svg{animation:iconPop .7s var(--spring)}
@keyframes iconPop{0%{transform:scale(1)}30%{transform:scale(1.2) rotate(-7deg)}60%{transform:scale(.94) rotate(3deg)}100%{transform:none}}
.icon .sweep{position:absolute;inset:0;background:linear-gradient(115deg,transparent 32%,rgba(255,255,255,.6) 48%,transparent 62%);transform:translateX(-130%);pointer-events:none}
.app:hover .icon .sweep{animation:sweep .9s var(--ease)}
@keyframes sweep{to{transform:translateX(130%)}}
.app:active .tilt{transform:scale(.92);transition-duration:.08s}
.app .label{margin-top:.6rem;font-size:.78rem;font-weight:600;letter-spacing:-.01em;opacity:.0;transform:translateY(-.3rem);transition:all .35s var(--ease);white-space:nowrap}
.app:hover .label{opacity:1;transform:none}
.i-apps{--g1:#5f6b85;--g2:#252b3a}
.icon.i-apps svg{inset:24%;width:52%;height:52%}

/* home layout: GRID (big clock + app tiles) */
.home-grid .spot{position:absolute;left:4.5rem;right:4.5rem;top:15%;bottom:24%;display:grid;grid-template-columns:.8fr 2.2fr;gap:3rem;align-items:center}
.home-grid:not(.has-continue) .spot{bottom:10%}
.big-clock{font-size:7.2rem;font-weight:200;letter-spacing:-.05em;line-height:.9;font-variant-numeric:tabular-nums}
.spot-l .date{margin-top:1rem;font-size:1.25rem;color:var(--dim);font-weight:500}
.spot-greet{margin-top:1.8rem;font-size:1.05rem;font-weight:650;display:flex;flex-direction:column;gap:.6rem}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:1rem}
.grid-app{width:auto;display:flex;align-items:center;gap:.9rem;padding:.9rem 1rem;border-radius:1.2rem;text-align:left;
  background:rgba(255,255,255,.06);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);transition:background .3s,box-shadow .3s;animation:dockIn .8s var(--spring) both}
.grid-app:hover{background:rgba(255,255,255,.13);box-shadow:inset 0 0 0 1px rgba(255,255,255,.22),0 1rem 2.4rem rgba(0,0,0,.35)}
.grid-app .tilt{width:3.4rem;flex:0 0 3.4rem;transform-origin:50% 50%;transform:scale(var(--mag,1)) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg))}
.grid-app:hover{--mag:1.1}
.grid-app .tx b{display:block;font-size:.98rem;font-weight:700;letter-spacing:-.01em}
.grid-app .tx small{display:block;font-size:.72rem;color:var(--dim);margin-top:.2rem;line-height:1.3}

/* home layout: RAIL (full-screen spotlight + slim app bar) */
.home-rail .shelf{height:100% !important}
.home-rail .shelf .meta{bottom:11.5rem !important}
.home-rail .shelf .dots{bottom:12rem !important}
.home-rail.has-continue .shelf .meta{bottom:17.5rem !important}
.home-rail.has-continue .shelf .dots{bottom:18rem !important}
.railbar{position:absolute;left:4.5rem;bottom:2.2rem;display:flex;gap:.6rem;padding:.55rem;border-radius:1.4rem}
.home-rail.has-continue .railbar{bottom:8.6rem}
.rail-app{width:auto;display:flex;align-items:center;gap:.6rem;padding:.35rem .9rem .35rem .4rem;border-radius:1rem;transition:background .3s;animation:dockIn .8s var(--spring) both}
.rail-app:hover{background:rgba(255,255,255,.12)}
.rail-app .tilt{width:2.6rem;flex:0 0 2.6rem;transform-origin:50% 50%;transform:scale(var(--mag,1)) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg))}
.rail-app:hover{--mag:1.14}
.rail-app span{font-size:.86rem;font-weight:650}

/* LIVE search cards */
.card .badge.live{background:#e91916;color:#fff}
.card.offline .t{color:var(--dim)}

/* TUBEMUSIC */
.card.sq{flex:0 0 13rem}
.card.sq .thumb{aspect-ratio:1}
.card.station{flex:0 0 15rem}
.card.station .mosaic{position:absolute;inset:0;display:grid;grid-template-columns:1fr 1fr;opacity:.55;mix-blend-mode:luminosity}
.card.station .mosaic img{width:100%;height:100%;object-fit:cover}
.card.station .stname{position:absolute;left:0;right:0;bottom:0;padding:1rem;background:linear-gradient(0deg,rgba(0,0,0,.75),transparent)}
.card.station .stname b{display:block;font-size:1.2rem;font-weight:800;letter-spacing:-.02em}
.card.station .stname small{font-size:.75rem;color:var(--dim)}
.music-hero{background:linear-gradient(120deg,rgba(255,61,110,.25),rgba(155,28,255,.18))}
.eqbig{margin-left:auto;display:flex;align-items:flex-end;gap:.35rem;height:6rem;padding-right:1rem}
.eqbig i,.eq i{display:block;width:.45rem;border-radius:.3rem;background:linear-gradient(0deg,#ff4d7a,#c86bff);animation:eq 1.1s ease-in-out infinite alternate}
.eqbig i:nth-child(odd){animation-duration:.8s}.eqbig i:nth-child(3n){animation-duration:1.4s}.eqbig i:nth-child(4n){animation-delay:-.4s}
@keyframes eq{0%{height:15%}50%{height:90%}100%{height:35%}}
.music-player{position:absolute;inset:0;display:grid;grid-template-columns:1.75fr 1fr;gap:2.6rem;padding:5.5rem 4.5rem 4rem 7rem;align-items:center;overflow:hidden}
.music-player .bg{position:absolute;inset:-10%;background-size:cover;background-position:center;filter:blur(70px) saturate(170%) brightness(.5);transform:scale(1.2);transition:background-image 1s}
.np{position:relative;z-index:1}
.np .screen{position:relative;aspect-ratio:16/9;border-radius:1.4rem;overflow:hidden;background:#000;box-shadow:0 0 0 1px rgba(255,255,255,.14),0 3rem 6rem rgba(0,0,0,.65);animation:phoneIn .9s var(--spring) both}
.np .screen iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.np .meta{display:flex;align-items:center;gap:1.2rem;margin-top:1.5rem}
.np .meta h2{font-size:1.7rem;font-weight:800;letter-spacing:-.03em;margin:.3rem 0 .2rem}
.np .meta p{color:var(--dim);font-size:.95rem}
.eq{display:flex;align-items:flex-end;gap:.25rem;height:2.6rem}
.eq i{width:.4rem;animation-play-state:paused;height:30%}
body.playing .eq i{animation-play-state:running}
.eq i:nth-child(2){animation-duration:.7s}.eq i:nth-child(3){animation-duration:1.3s}.eq i:nth-child(4){animation-duration:.9s}
.upnext{position:relative;z-index:1;border-radius:1.4rem;padding:1.2rem;max-height:76%;overflow:auto;background:rgba(18,18,22,.5)}
.upnext .eyebrow{margin:0 0 .8rem .3rem}
.un{display:flex;align-items:center;gap:.8rem;width:100%;padding:.5rem;border-radius:.8rem;text-align:left;transition:background .25s}
.un:hover{background:rgba(255,255,255,.08)}
.un.on{background:rgba(255,77,122,.18)}
.un img{width:4.4rem;aspect-ratio:16/9;object-fit:cover;border-radius:.45rem;flex:0 0 auto}
.un span{flex:1;min-width:0}.un b{display:block;font-size:.88rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.un small{display:block;font-size:.74rem;color:var(--dim)}
.un em{font-style:normal;font-size:.68rem;font-weight:700;color:#ff6f95;letter-spacing:.05em;text-transform:uppercase}
.upnext .hint{color:var(--dim);font-size:.85rem;padding:.4rem}

/* ALL APPS: tiles spread out from the centre */
.allapps .spread{position:absolute;left:6rem;right:6rem;top:20%;display:grid;grid-template-columns:repeat(3,1fr);gap:2.4rem 3rem}
.spread-app{width:auto;display:flex;flex-direction:column;align-items:center;gap:.5rem;padding:1.4rem 1rem 1.2rem;border-radius:1.6rem;
  opacity:0;transform:translate(var(--fx,0),var(--fy,0)) scale(.3)}
.spread.go .spread-app{opacity:1;transform:none;transition:transform .9s var(--spring) calc(var(--i) * .07s),opacity .5s ease calc(var(--i) * .07s),background .3s}
.spread-app:hover{background:rgba(255,255,255,.07)}
.spread-app .tilt{width:6rem;transform-origin:50% 50%;transform:scale(var(--mag,1)) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg))}
.spread-app:hover{--mag:1.12}
.spread-app b{margin-top:.5rem;font-size:1.15rem;font-weight:700}
.spread-app small{font-size:.8rem;color:var(--dim)}
.dock .app{animation:dockIn .8s var(--spring) both}
@keyframes dockIn{from{opacity:0;transform:translateY(2.5rem) scale(.8)}}

.continue{position:absolute;left:4.5rem;right:4.5rem;bottom:1.3rem}
.continue .eyebrow{font-size:.68rem}
.home.has-continue .shelf{height:50%}
.home.has-continue .shelf .meta{bottom:3.4rem}
.home.has-continue .shelf .dots{bottom:3.8rem}
.home.has-continue .dock{top:51%}
.continue .eyebrow{margin-bottom:.7rem}
.mini-row{display:flex;gap:1rem;overflow-x:auto;scroll-behavior:smooth}
.mini{flex:0 0 8.6rem;border-radius:.8rem;overflow:hidden;position:relative;aspect-ratio:16/9;transition:transform .4s var(--spring);background:#111}
.mini:hover{transform:scale(1.07)}
.mini img{width:100%;height:100%;object-fit:cover}
.mini span{position:absolute;left:.6rem;right:.6rem;bottom:.45rem;font-size:.72rem;font-weight:600;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 6px #000}
.mini::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(0,0,0,.7),transparent 55%)}
.mini span{z-index:1}

/* =====================================================================
   APP CHROME (shared by browse screens)
   ===================================================================== */
.appview{overflow-y:auto;overflow-x:hidden;scroll-behavior:smooth}
.appbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:1.2rem;padding:1.6rem 4.5rem 1.2rem;
  background:linear-gradient(180deg,rgba(5,5,7,.85),rgba(5,5,7,0))}
.appbar .brand{display:flex;align-items:center;gap:.7rem;font-size:1.5rem;font-weight:800;letter-spacing:-.04em}
.appbar .brand .icon{width:2.3rem;border-radius:.6rem}
.appbar .brand .icon svg{inset:20%;width:60%;height:60%}
.appbar .spacer{flex:1}
.search{display:flex;align-items:center;gap:.4rem;height:2.9rem;width:27rem;padding:0 .35rem 0 1.1rem;border-radius:99rem}
.search svg{width:1.05rem;height:1.05rem;opacity:.6;flex:none}
.search input{flex:1;height:100%;font-size:.92rem;user-select:text;min-width:0}
.search input::placeholder{color:var(--faint)}
.search button{height:2.2rem;padding:0 1rem;border-radius:99rem;background:var(--accent);color:#000;font-weight:700;font-size:.85rem;transition:transform .3s var(--spring)}
.search button:hover{transform:scale(1.07)}

.hero{position:relative;margin:0 4.5rem 2.4rem;height:23rem;border-radius:1.6rem;overflow:hidden;box-shadow:0 2rem 4rem rgba(0,0,0,.5)}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform 1.2s var(--ease)}
.hero:hover img{transform:scale(1.04)}
.hero .shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.85),rgba(0,0,0,.2) 60%,transparent),linear-gradient(0deg,rgba(0,0,0,.6),transparent 50%)}
.hero .meta{position:absolute;left:2.6rem;bottom:2.4rem;max-width:30rem}
.hero h2{font-size:2.5rem;font-weight:750;letter-spacing:-.035em;line-height:1.05;margin:.5rem 0 1.2rem}
.hero .art{position:absolute;inset:0;background:linear-gradient(135deg,var(--g1),var(--g2))}

.row{margin:0 0 2.2rem}
.row h3{margin:0 4.5rem .9rem;font-size:1.2rem;font-weight:700;letter-spacing:-.02em}
.track{display:flex;gap:1.3rem;overflow-x:auto;padding:.9rem 4.5rem 1.4rem;scroll-snap-type:x proximity;scroll-padding-inline:4.5rem;scroll-behavior:smooth;scrollbar-width:none}
.track::-webkit-scrollbar,.mini-row::-webkit-scrollbar{display:none}
/* row arrows: the mouse wheel moves the page up/down, these move a row sideways */
.trackwrap{position:relative}
.tarrow{position:absolute;top:50%;z-index:4;width:3rem;height:3rem;margin-top:-1.9rem;border-radius:50%;display:grid;place-items:center;
  font-size:1.6rem;font-weight:700;line-height:1;color:#fff;background:rgba(20,20,26,.72);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  box-shadow:0 0 0 1px rgba(255,255,255,.16),0 .8rem 2rem rgba(0,0,0,.5);cursor:pointer;transition:opacity .3s,transform .35s var(--spring)}
.tarrow.l{left:1rem}.tarrow.r{right:1rem}
.tarrow:hover{transform:scale(1.12);background:rgba(60,60,72,.85)}
.tarrow[hidden]{display:grid;opacity:0;pointer-events:none}
.card{flex:0 0 17rem;min-width:0;text-align:left;scroll-snap-align:start}
.card .thumb{position:relative;aspect-ratio:16/9;border-radius:1rem;overflow:hidden;background:#15151a;
  box-shadow:0 .8rem 1.8rem rgba(0,0,0,.45);transition:transform .45s var(--spring),box-shadow .45s}
.card .thumb img{width:100%;height:100%;object-fit:cover}
.card .thumb .art{position:absolute;inset:0;background:linear-gradient(135deg,var(--g1,#333),var(--g2,#111));display:grid;place-items:center;font-size:3.2rem;font-weight:800;letter-spacing:-.05em}
.card .thumb::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);
  background:linear-gradient(120deg,rgba(255,255,255,.22),transparent 40%);opacity:0;transition:opacity .35s}
.card:hover .thumb{transform:scale(1.08);box-shadow:0 1.6rem 3rem rgba(0,0,0,.6),0 0 0 .16rem rgba(255,255,255,.9)}
.card:hover .thumb::after{opacity:1}
.card .t{margin-top:.8rem;font-size:.95rem;font-weight:600;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:transform .4s var(--spring)}
.card .s{font-size:.8rem;color:var(--dim);margin-top:.2rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card:hover .t{transform:translateY(.45rem)}
.card:hover .s{transform:translateY(.45rem)}
.badge{position:absolute;top:.6rem;left:.6rem;z-index:2;height:1.35rem;padding:0 .55rem;border-radius:.4rem;font-size:.66rem;font-weight:800;letter-spacing:.06em;display:flex;align-items:center;gap:.3rem;background:rgba(0,0,0,.55);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.badge.live{background:#ff3b30}
.card.tall{flex-basis:11.5rem}
.card.tall .thumb{aspect-ratio:9/16;border-radius:1.2rem}
.empty{margin:0 4.5rem;padding:2.2rem;border-radius:1.4rem;color:var(--dim);font-size:.95rem;line-height:1.5}
.empty b{color:var(--text)}

/* themes */
.theme-tube{--accent:#ff375f}
.theme-loops{--accent:#2ff3e0}
.theme-live{--accent:#a970ff}
.theme-music{--accent:#ff4d7a}
.theme-pulse{--accent:#53fc18}
.theme-theater{--accent:#ffb340}
body.theme-tube #wall{--w1:#ff2d55;--w2:#ff7a45;--w3:#5a0b2a}
body.theme-loops #wall{--w1:#00e5d0;--w2:#ff2e93;--w3:#3a1cff}
body.theme-live #wall{--w1:#7c3aed;--w2:#a970ff;--w3:#1f0b4d}
body.theme-music #wall{--w1:#ff2d6f;--w2:#9b1cff;--w3:#3a0b5c}
body.theme-pulse #wall{--w1:#00c853;--w2:#53fc18;--w3:#003d2a}
body.theme-theater #wall{--w1:#ff9500;--w2:#ff3b30;--w3:#4a1d00}

.loops-wordmark span{background:linear-gradient(90deg,#2ff3e0,#ff2e93);-webkit-background-clip:text;background-clip:text;color:transparent}

/* theater */
.sites{display:grid;grid-template-columns:repeat(4,1fr);gap:1.4rem;margin:0 4.5rem 2rem}
.site{position:relative;height:9.5rem;border-radius:1.3rem;overflow:hidden;text-align:left;padding:1.3rem 1.4rem;
  background:linear-gradient(140deg,var(--g1),var(--g2));box-shadow:inset 0 0 0 1px rgba(255,255,255,.15),0 1rem 2rem rgba(0,0,0,.4);transition:transform .45s var(--spring),box-shadow .45s}
.site::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.25),transparent 50%);mix-blend-mode:soft-light}
.site:hover{transform:scale(1.06);box-shadow:0 1.6rem 3rem rgba(0,0,0,.55),0 0 0 .16rem #fff}
.site b{display:block;font-size:1.45rem;font-weight:800;letter-spacing:-.035em}
.site .stag{position:absolute;right:1rem;top:1rem;z-index:1;font-size:.6rem;font-weight:800;letter-spacing:.09em;text-transform:uppercase;padding:.28rem .55rem;border-radius:.45rem;background:rgba(0,0,0,.32)}
.site .stag.ext{background:rgba(255,255,255,.2)}
.sicon{width:2.3rem;aspect-ratio:1;border-radius:.6rem;display:grid;place-items:center;font-weight:900;font-size:1.2rem;letter-spacing:-.04em;
  background:linear-gradient(140deg,var(--g1),var(--g2));box-shadow:inset 0 0 0 1px rgba(255,255,255,.22),0 .4rem 1rem rgba(0,0,0,.35)}
.player video{position:absolute;inset:0;width:100%;height:100%;background:#000;object-fit:contain}
.grid>.empty{grid-column:1/-1;margin:0}
.mfilters{margin:.4rem 4.5rem 2rem;padding:1.1rem 1.4rem;border-radius:1.3rem;display:flex;flex-direction:column;gap:.75rem}
.frow{display:grid;grid-template-columns:6.4rem 1fr;align-items:start;gap:.6rem}
.flab{padding-top:.62rem;font-size:.68rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.chips{display:flex;flex-wrap:wrap;gap:.45rem}
.chip{height:2.25rem;padding:0 1rem;border-radius:99rem;font-size:.84rem;font-weight:600;background:rgba(255,255,255,.08);box-shadow:inset 0 0 0 1px rgba(255,255,255,.1);
  transition:transform .35s var(--spring),background .25s}
.chip:hover{background:rgba(255,255,255,.2);transform:scale(1.07)}
.chip.on{background:var(--accent);color:#fff;box-shadow:0 .5rem 1.2rem rgba(0,0,0,.35)}
.row h3 .mcount{font-size:.85rem;font-weight:600;color:var(--dim);margin-left:.6rem}
.row h3 .mclear{height:2.1rem;padding:0 1rem;font-size:.78rem;margin-left:1rem;vertical-align:middle}
.card .thumb img.pbg{position:absolute;inset:0;filter:blur(1rem) brightness(.6);transform:scale(1.3)}
.card .thumb img.pfit{position:absolute;inset:0;object-fit:contain}
.hero img.hbg{filter:blur(2.2rem) brightness(.55) saturate(1.2);transform:scale(1.25)}
.hero img.hposter{left:auto;right:4.5rem;top:50%;bottom:auto;width:auto;height:78%;max-width:40%;object-fit:contain;transform:translateY(-50%);
  border-radius:.9rem;box-shadow:0 1.6rem 3.5rem rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.12)}
.empty .actions{margin-top:1rem;display:flex;gap:.6rem}
.site small{position:absolute;left:1.4rem;right:1.4rem;bottom:1.1rem;font-size:.78rem;color:rgba(255,255,255,.8);line-height:1.35}
.note{margin:0 4.5rem 3rem;padding:1.2rem 1.4rem;border-radius:1rem;font-size:.85rem;color:var(--dim);line-height:1.5;display:flex;gap:.9rem;align-items:flex-start}
.note svg{flex:none;width:1.2rem;height:1.2rem;margin-top:.1rem}

/* =====================================================================
   PLAYERS
   ===================================================================== */
.player{background:#000}
.player iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000}
.hud{position:absolute;left:1.2rem;top:50%;z-index:5;display:flex;flex-direction:column;align-items:flex-start;gap:.8rem;transform:translateY(-50%);
  transition:opacity .5s var(--ease),transform .5s var(--ease)}
.hud .title{display:flex;flex-direction:column;min-width:0;padding:0 1.2rem;height:3.1rem;justify-content:center;border-radius:99rem}
.hud .title b{font-size:.95rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:34rem}
.hud .title small{font-size:.72rem;color:var(--dim)}
.hud .spacer{flex:1}
.hud .pill{height:3.1rem;padding:0 1.2rem}
.hud .round{width:3.1rem;padding:0;justify-content:center}
/* darker glass over bright video */
.player .hud .glass{background:rgba(18,18,22,.55)}
body.idle .hud{opacity:0;transform:translate(-1.5rem,-50%);pointer-events:none}
.hud.top{top:1.4rem;transform:none}
body.idle .hud.top{transform:translateX(-1.5rem)}
.hud .pill{gap:0;min-width:3.1rem;justify-content:center}
.hud .pill:hover{gap:.55rem}
.hud .lbl{max-width:0;overflow:hidden;white-space:nowrap;opacity:0;transition:max-width .45s var(--ease),opacity .3s}
.hud .pill:hover .lbl{max-width:15rem;opacity:1}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1.8rem 1.3rem;margin:0 4.5rem 3rem}
.grid .card{width:100%}
body.idle{cursor:none}
/* the hud only sits over the top 6rem so the embedded player stays clickable */
.player .catcher{position:absolute;left:0;top:14%;bottom:24%;width:5.5rem;z-index:4}

.live-layout{position:absolute;inset:0;display:flex}
.live-layout .stage{position:relative;flex:1}
.live-layout .chat{width:22rem;border-left:1px solid rgba(255,255,255,.08);position:relative;transition:width .5s var(--ease)}
.live-layout .chat iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.live-layout.nochat .chat{width:0}

.loops-player{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:3rem;overflow:hidden}
.loops-player .bg{position:absolute;inset:-10%;background-size:cover;background-position:center;filter:blur(60px) saturate(160%) brightness(.55);transform:scale(1.2)}
.loops-player .bg.fallback{background:radial-gradient(circle at 30% 30%,#00e5d0 0,transparent 40%),radial-gradient(circle at 70% 70%,#ff2e93 0,transparent 45%),#07070a;filter:blur(40px) brightness(.6)}
.phone{position:relative;height:88%;aspect-ratio:9/16;border-radius:1.8rem;overflow:hidden;background:#000;
  box-shadow:0 0 0 1px rgba(255,255,255,.14),0 3rem 6rem rgba(0,0,0,.7);animation:phoneIn .9s var(--spring) both}
@keyframes phoneIn{from{transform:translateY(3rem) scale(.94);opacity:0}}
.phone.from-bottom{animation:slideUp .65s var(--spring) both}
.phone.from-top{animation:slideDown .65s var(--spring) both}
@keyframes slideUp{from{transform:translateY(70%) scale(.92);opacity:0}}
@keyframes slideDown{from{transform:translateY(-70%) scale(.92);opacity:0}}
.feedhint{margin-top:1.4rem;font-size:.75rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--faint)}
.peek{display:flex;flex-direction:column;gap:.5rem;margin-top:1.2rem}
.peek img{width:3.6rem;aspect-ratio:9/16;object-fit:cover;border-radius:.5rem;opacity:0;transition:opacity .6s;box-shadow:0 0 0 1px rgba(255,255,255,.15)}
.peek img.on{opacity:.75}
.phone iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.side{position:relative;width:17rem;z-index:2}
.side.info h2{font-size:1.5rem;font-weight:750;letter-spacing:-.03em;line-height:1.15;margin:.5rem 0 .6rem}
.side.info p{font-size:.88rem;color:var(--dim);line-height:1.45}
.rail{display:flex;flex-direction:column;gap:1rem;align-items:flex-start}
.rail .pill{height:3.4rem;width:3.4rem;padding:0;justify-content:center}
.rail .pill svg{width:1.3rem;height:1.3rem}
.counter{font-size:.8rem;color:var(--dim);font-variant-numeric:tabular-nums;margin-left:.3rem}

/* ambient */
.ambient{display:grid;place-items:center;cursor:pointer}
.aurora{position:absolute;inset:-20%;background:
  radial-gradient(40% 30% at 30% 40%,rgba(0,255,200,.45),transparent 70%),
  radial-gradient(35% 30% at 70% 35%,rgba(120,80,255,.55),transparent 70%),
  radial-gradient(45% 35% at 50% 80%,rgba(0,120,255,.35),transparent 70%),#020308;
  filter:blur(30px);animation:aur 22s ease-in-out infinite alternate}
@keyframes aur{50%{transform:rotate(8deg) scale(1.15) translate(4%,-3%)}100%{transform:rotate(-6deg) scale(1.05) translate(-4%,3%)}}
.stars{position:absolute;inset:0;background-image:radial-gradient(1px 1px at 20% 30%,#fff,transparent),radial-gradient(1px 1px at 80% 20%,#fff,transparent),radial-gradient(1.5px 1.5px at 60% 70%,#fff,transparent),radial-gradient(1px 1px at 35% 80%,#fff,transparent),radial-gradient(1px 1px at 90% 60%,#fff,transparent),radial-gradient(1.2px 1.2px at 10% 65%,#fff,transparent),radial-gradient(1px 1px at 50% 12%,#fff,transparent);opacity:.5;animation:twinkle 6s ease-in-out infinite alternate}
@keyframes twinkle{to{opacity:.85}}
.bigclock{position:relative;text-align:center}
.bigclock .time{font-size:11rem;font-weight:200;letter-spacing:-.06em;line-height:1;font-variant-numeric:tabular-nums;
  background:linear-gradient(180deg,#fff,rgba(255,255,255,.55));-webkit-background-clip:text;background-clip:text;color:transparent}
.bigclock .date{font-size:1.4rem;font-weight:500;color:var(--dim);margin-top:.6rem;letter-spacing:-.01em}
.bigclock .hint{margin-top:3rem;font-size:.8rem;color:var(--faint);letter-spacing:.12em;text-transform:uppercase}
#saver{position:fixed;inset:0;z-index:40;opacity:0;pointer-events:none;transition:opacity 1.5s var(--ease)}
#saver.on{opacity:1;pointer-events:auto}

/* shutdown — CRT collapse: frame squeezes to a line, then to a dot, flares, bursts into sparks */
.off{background:#000;overflow:hidden}
.off canvas{position:absolute;inset:0;width:100%;height:100%;z-index:3}
.crt{position:absolute;inset:0;z-index:1;transform-origin:50% 50%;
  background:radial-gradient(60% 70% at 25% 20%,rgba(43,92,255,.75),transparent 70%),radial-gradient(55% 65% at 85% 25%,rgba(162,60,255,.7),transparent 70%),
             radial-gradient(70% 60% at 50% 110%,rgba(0,194,199,.55),transparent 70%),#0a0b12}
.crt::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.035) 0 1px,transparent 1px 3px)}
.crt .ghost{position:absolute;left:50%;top:45%;width:7rem;height:7rem;margin:-3.5rem 0 0 -3.5rem;border-radius:50%;opacity:.9;
  background:radial-gradient(circle at 36% 30%,#fff 0,#dff3ff 9%,#8fc8ff 24%,#6b7dff 46%,#7a2fff 70%,#21094a 100%);box-shadow:0 0 4rem rgba(120,160,255,.8)}
.dot{position:absolute;left:50%;top:50%;width:1rem;height:1rem;margin:-.5rem 0 0 -.5rem;border-radius:50%;z-index:2;opacity:0;
  background:radial-gradient(circle,#fff 0,#dff3ff 35%,rgba(140,180,255,.6) 60%,transparent 72%);box-shadow:0 0 2rem #fff,0 0 6rem rgba(124,196,255,.9),0 0 12rem rgba(122,47,255,.6)}
.ripple{position:absolute;left:50%;top:50%;width:2rem;height:2rem;margin:-1rem 0 0 -1rem;border-radius:50%;z-index:2;opacity:0;border:.12rem solid rgba(190,215,255,.9)}
.bye{position:absolute;left:0;right:0;top:58%;z-index:4;text-align:center;opacity:0}
.bye .orb-mini{width:2.2rem;height:2.2rem;margin:0 auto 1rem}
.bye b{display:block;font-size:2.2rem;font-weight:300;letter-spacing:.32em;padding-left:.32em}
.bye small{display:block;margin-top:.7rem;font-size:.8rem;font-weight:600;letter-spacing:.4em;padding-left:.4em;color:var(--dim);text-transform:uppercase}
.off.go .crt{animation:crtSqueeze 2.1s cubic-bezier(.7,0,.84,0) forwards}
.off.go .dot{animation:dotFlare 2.6s 1.95s ease-out forwards}
.off.go .ripple{animation:ripple 2.4s 2.35s cubic-bezier(.2,.8,.2,1) forwards}
.off.go .bye{animation:bye 5.2s 2.6s ease forwards}
.off.done .crt,.off.done .dot,.off.done .ripple,.off.done .bye{display:none}
@keyframes crtSqueeze{
  0%{transform:scale(1,1);filter:brightness(1)}
  55%{transform:scale(1,.006);filter:brightness(3.2) saturate(.4)}
  90%{transform:scale(.004,.006);filter:brightness(6) saturate(0)}
  100%{transform:scale(0,0);filter:brightness(8);opacity:0}}
@keyframes dotFlare{0%{opacity:1;transform:scale(1)}18%{opacity:1;transform:scale(2.6)}60%{opacity:.8;transform:scale(.9)}100%{opacity:0;transform:scale(.2)}}
@keyframes ripple{0%{opacity:.9;transform:scale(1)}100%{opacity:0;transform:scale(26);border-width:.02rem}}
@keyframes bye{0%{opacity:0;transform:translateY(.8rem);filter:blur(8px)}25%{opacity:1;transform:none;filter:none}75%{opacity:1}100%{opacity:0;filter:blur(6px)}}

/* toast */
#toast{position:fixed;left:50%;bottom:2.4rem;transform:translate(-50%,2rem);opacity:0;z-index:60;padding:.95rem 1.4rem;border-radius:99rem;font-size:.9rem;font-weight:600;transition:all .5s var(--spring);pointer-events:none;max-width:44rem;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}

/* =====================================================================
   BOOT SEQUENCE
   ===================================================================== */
#boot{position:fixed;inset:0;z-index:100;background:#000;display:none;overflow:hidden;cursor:pointer}
#boot.on{display:block}
#boot canvas{position:absolute;inset:0;width:100%;height:100%}
#boot .core{position:absolute;left:50%;top:45%;width:11rem;height:11rem;margin:-5.5rem 0 0 -5.5rem}
#boot .orb{position:absolute;inset:0;border-radius:50%;opacity:0;transform:scale(.2);
  background:radial-gradient(circle at 36% 30%,#fff 0,#dff3ff 9%,#8fc8ff 24%,#6b7dff 46%,#7a2fff 70%,#21094a 100%);
  box-shadow:0 0 4rem rgba(120,160,255,.85),0 0 12rem rgba(122,47,255,.55),inset -1.2rem -1.6rem 3rem rgba(20,0,60,.6)}
#boot .ring{position:absolute;inset:-1.6rem;border-radius:50%;opacity:0;
  background:conic-gradient(from 0deg,transparent 0 55%,rgba(124,196,255,.0) 58%,#7cc4ff 75%,#b18cff 88%,#fff 99%,transparent 100%);
  -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - .22rem),#000 calc(100% - .2rem));mask:radial-gradient(farthest-side,transparent calc(100% - .22rem),#000 calc(100% - .2rem));filter:drop-shadow(0 0 .6rem #7cc4ff)}
#boot .flare{position:absolute;left:50%;top:45%;width:70rem;height:.18rem;margin:-.09rem 0 0 -35rem;opacity:0;
  background:linear-gradient(90deg,transparent,rgba(124,196,255,.7) 35%,#fff 50%,rgba(177,140,255,.7) 65%,transparent);filter:blur(.5px)}
#boot .word{position:absolute;left:0;right:0;top:61%;text-align:center;font-size:3.6rem;font-weight:300;letter-spacing:.32em;padding-left:.32em}
#boot .word span{display:inline-block;opacity:0;filter:blur(12px);transform:translateY(.6rem)}
#boot .tag{position:absolute;left:0;right:0;top:71.5%;text-align:center;font-size:.8rem;font-weight:600;letter-spacing:.5em;padding-left:.5em;color:var(--dim);opacity:0}
#boot.go .orb{animation:orbIn 1.3s .95s var(--spring) forwards,orbPulse 3s 2.3s ease-in-out infinite}

@keyframes orbIn{to{opacity:1;transform:scale(1)}}
@keyframes orbPulse{50%{box-shadow:0 0 5rem rgba(120,160,255,1),0 0 15rem rgba(122,47,255,.7),inset -1.2rem -1.6rem 3rem rgba(20,0,60,.6)}}
@keyframes ringIn{to{opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}

@keyframes letter{to{opacity:1;filter:none;transform:none}}
@keyframes fadeUp{to{opacity:1}}
@keyframes bootOut{to{opacity:0;visibility:hidden}}
@keyframes coreOut{to{transform:scale(3.2);filter:blur(20px);opacity:0}}
body.booting .view{animation:none;opacity:0}

function go(params) {
  // Every screen is a real URL. Shared media mirrors the URL to everyone

  const qs = new URLSearchParams();
  Object.entries(params || {}).forEach(([k, v]) => { if (v !== undefined && v !== null && v !== "") qs.set(k, v); });

  const m = s.match(/(?:v=|youtu\.be\/|shorts\/|embed\/|live\/)([\w-]{11})/);

  return /^[\w-]{11}$/.test(s) ? s : null;
}
function ytStart(s) {
  const m = (s || "").match(/[?&]t=(\d+)/); return m ? +m[1] : 0;
}
function ttId(s) {
  s = (s || "").trim();
  const m = s.match(/(?:video|player\/v1|embed\/v2|embed)\/(\d{8,25})/);
  if (m) return m[1];
  return /^\d{8,25}$/.test(s) ? s : null;
}
function chan(s) {
  s = (s || "").trim();
  const m = s.match(/(?:twitch\.tv|kick\.com)\/(?:popout\/)?([A-Za-z0-9_]{2,40})/);
  if (m) return m[1].toLowerCase();
  return /^[A-Za-z0-9_]{2,40}$/.test(s) ? s.toLowerCase() : null;
}

const imgHiLoad = (id) => `if(this.naturalWidth<=120&&!this.dataset.f){this.dataset.f=1;this.src='${ytThumb(id)}'}`;

async function ytMeta(id) {

}
async function ttMeta(id) {

/* hover life for app icons: tvOS tilt + specular, and macOS-style magnify along the dock */
function appFx() {
  $$(".app").forEach(el => {
    el.addEventListener("mousemove", e => {
      const r = el.getBoundingClientRect(), x = (e.clientX - r.left) / r.width, y = (e.clientY - r.top) / r.height;
      el.style.setProperty("--ry", ((x - .5) * 16).toFixed(1) + "deg"); el.style.setProperty("--rx", ((.5 - y) * 16).toFixed(1) + "deg");
      const ic = $(".icon", el); ic.style.setProperty("--mx", (x * 100) + "%"); ic.style.setProperty("--my", (y * 100) + "%");
    });
    el.addEventListener("mouseleave", () => { el.style.removeProperty("--rx"); el.style.removeProperty("--ry"); });
  });
  const dock = $(".dock");
  if (dock) {
    dock.addEventListener("mousemove", e => $$(".app", dock).forEach(el => {
      const r = el.getBoundingClientRect(), d = Math.abs(e.clientX - (r.left + r.width / 2)) / r.width;
      el.style.setProperty("--mag", (1 + .42 * Math.max(0, 1 - d / 2.4) ** 2).toFixed(3));
    }));
    dock.addEventListener("mouseleave", () => $$(".app", dock).forEach(el => el.style.removeProperty("--mag")));
  }
}

/* ---------- LOOPS: a scrollable feed that stays inside lumen ---------- */
// Today's mix: the pinned loops in a date-seeded order (the same for everyone), then ones you added.
function loopIds() {
  const dead = new Set(store.get("loopsDead", []));
  const pinned = CONFIG.loops.items.map(ttId).filter(Boolean);
  let seed = +new Date().toISOString().slice(0, 10).replace(/-/g, "") % 233280;
  const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
  for (let i = pinned.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [pinned[i], pinned[j]] = [pinned[j], pinned[i]]; }
  const mine = store.get("history", []).filter(h => h.app === "loops").map(h => h.id);
  return [...new Set([...pinned, ...mine])].filter(id => !dead.has(id));
}
// Is this TikTok still up? "dead" only when TikTok itself says the video doesn't exist.
async function ttCheck(id) {
  let gone = 0;
  for (const u of [`https://www.tiktok.com/@_/video/${id}`, `https://www.tiktok.com/video/${id}`]) {
    try {
      const r = await fetch(`https://www.tiktok.com/oembed?url=${encodeURIComponent(u)}`);
      if (r.ok) { store.set("loopsSeenOk", 1); return "ok"; }
      if (r.status === 400 || r.status === 404) gone++;
    } catch (e) { return "unknown"; }
  }
  return gone === 2 && store.get("loopsSeenOk", 0) ? "dead" : "unknown";
}

}

/* ---------- LIVE search, inside lumen (no Twitch account needed: public DecAPI lookups) ---------- */
async function decapi(path) {
  try {
    const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), 7000);
    const r = await fetch("https://decapi.me/twitch/" + path, { signal: ctl.signal }); clearTimeout(t);
    return r.ok ? (await r.text()).trim() : "";
  } catch (e) { return ""; }
}
async function pool(items, n, fn) {           // run fn over items, n at a time
  const out = []; let i = 0;
  await Promise.all(Array.from({ length: Math.min(n, items.length) }, async () => { while (i < items.length) { const k = i++; out[k] = await fn(items[k]); } }));
  return out;
}
async function chanInfo(name, needAvatar) {
  const up = await decapi("uptime/" + name);
  const live = !!up && !/offline|not found|error|invalid/i.test(up);
  let avatar = "";
  if (needAvatar || !live) { avatar = await decapi("avatar/" + name); if (!/^https?:/.test(avatar)) { if (!live) return null; avatar = ""; } }
  const info = { name, live, avatar, title: "", game: "", viewers: 0 };
  if (live) [info.title, info.game, info.viewers] = await Promise.all([decapi("title/" + name), decapi("game/" + name), decapi("viewercount/" + name).then(v => +v || 0)]);
  return info;
}
// who among the popular streamers is live right now (cached for 3 minutes, shared by search + "Live now")
async function popularLive() {
  try { const c = JSON.parse(sessionStorage.getItem("lumen.poplive") || "null"); if (c && Date.now() - c.t < 180000) return c.list; } catch (e) {}
  const all = await pool(CONFIG.live.popular, 6, async n => { const up = await decapi("uptime/" + n); return up && !/offline|not found|error|invalid/i.test(up) ? n : null; });
  const live = await pool(all.filter(Boolean), 6, n => chanInfo(n, false));
  const list = live.filter(Boolean).sort((a, b) => b.viewers - a.viewers);
  try { sessionStorage.setItem("lumen.poplive", JSON.stringify({ t: Date.now(), list })); } catch (e) {}
  return list;
}

const decodeEnt = s => { const t = document.createElement("textarea"); t.innerHTML = s; return t.value; };

/* ---------- in-app YouTube search (results stay inside lumen) ---------- */
const fmtDur = d => !(d > 0) ? "" : (d >= 3600 ? Math.floor(d / 3600) + ":" + String(Math.floor(d / 60) % 60).padStart(2, "0") : Math.floor(d / 60)) + ":" + String(d % 60).padStart(2, "0");
async function ytSearch(q, music) {
  if (CONFIG.youtubeApiKey) {          // your own key, if you added one
    const r = await fetch("https://www.googleapis.com/youtube/v3/search?part=snippet&type=video&videoEmbeddable=true&maxResults=24" +
      (music ? "&videoCategoryId=10" : "") + "&q=" + encodeURIComponent(q) + "&key=" + CONFIG.youtubeApiKey);
    const j = await r.json();
    if (r.ok) return (j.items || []).filter(it => it.id && it.id.videoId).map(it => ({ id: it.id.videoId, title: decodeEnt(it.snippet.title), sub: decodeEnt(it.snippet.channelTitle) }));
  }
  const pref = store.get("searchOk", "");
  const servers = [...new Set([pref, ...CONFIG.searchServers].filter(Boolean))];
  const filters = music ? ["music_songs", "videos"] : ["videos"];
  for (const f of filters) for (const base of servers) {
    try {
      const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), 7000);
      const r = await fetch(`${base}/search?q=${encodeURIComponent(q)}&filter=${f}`, { signal: ctl.signal });
      clearTimeout(t);
      if (!r.ok) continue;
      const j = await r.json();
      const items = (j.items || []).filter(x => x.url && /watch\?v=/.test(x.url) && !x.isShort)
        .map(x => ({ id: x.url.split("v=")[1].slice(0, 11), title: x.title || "", sub: [x.uploaderName, fmtDur(x.duration)].filter(Boolean).join(" · ") }));
      if (items.length) { store.set("searchOk", base); return items; }
    } catch (e) { /* try the next server */ }
  }
  throw new Error("the search servers are busy right now");
}
function searchFail(app, q, err) {
  return `<div class="empty glass"><b>Couldn't search right now</b> (${esc(err.message)}).<br>Give it a few seconds and try again — you can also paste a YouTube link straight into the search box.
    <div style="margin-top:1rem;display:flex;gap:.6rem;justify-content:center"><button class="pill primary" data-go='${attr({ app, find: q, t: now() })}'>Try again</button>
    <button class="pill glass" data-open="${esc(SEARCH_URL[app](q))}">Open on YouTube instead</button></div></div>`;
}

  return "https://www.google.com/search?q=" + encodeURIComponent(raw);   // words = search

async function movieFind(q) {                 // search, keep only full-length uploads from the verified channels (cached 1 hour)

function setupScreensaver() {
  const mins = CONFIG.screensaverMinutes; if (!mins) return;
  const s = $("#saver"); let t;
  const arm = () => { clearTimeout(t); if (s.classList.contains("on")) { s.classList.remove("on"); SFX.wake(); } t = setTimeout(() => { s.innerHTML = `<div class="view ambient" style="animation:none">${ambientHTML()}</div>`; s.classList.add("on"); SFX.sleep(); }, mins * 60000); };

/* ---------- player HUD auto-hide ---------- */
function setupHudIdle() {
  let t; const b = document.body;

document.addEventListener("mouseover", e => {
  const el = e.target.closest("[data-go],[data-url],.pill,.app,.card,.site,.search button");
  if (el && !el.contains(e.relatedTarget)) SFX.hover();
});
document.addEventListener("mousedown", () => SFX.unlock(), { passive: true });
document.addEventListener("click", e => {
  if (e.target.closest("button,[data-go],[data-url]")) SFX.click();
  const op = e.target.closest("[data-open]");
  if (op) { openWeb(op.dataset.open); return; }
  const site = e.target.closest("[data-url]");
  if (site) { rememberWeb(site.dataset.url); toast("Opening " + site.querySelector("b").textContent + " for everyone…"); document.body.classList.add("leaving"); setTimeout(() => location.assign(site.dataset.url), 600); return; }
  const el = e.target.closest("[data-go]");
  if (!el) return;
  let p = {}; try { p = JSON.parse(el.dataset.go || "{}"); } catch (err) {}
  if (el.dataset.fresh === "at") p.at = now();
  if (CONFIG.syncPlayback && (p.app === "tube" && p.v || p.app === "music" && (p.v || p.st) || (p.app === "theater" || p.app === "movies") && p.v) && !p.at) p.at = now();
  go(p);
});
document.addEventListener("submit", e => {
  const f = e.target.closest("form.search, form.urlbar"); if (!f) return;
  e.preventDefault();
  const app = f.dataset.app, raw = $("input", f).value.trim();
  if (!raw) return;
  if (app === "tube") { const id = ytId(raw); id ? go({ app, v: id, at: now(), s: ytStart(raw) || "" }) : go({ app, find: raw }); }
  else if (app === "music") { const id = ytId(raw); id ? go({ app, v: id }) : go({ app, find: raw }); }
  else if (app === "loops") { const id = ttId(raw); id ? go({ app, id }) : toast("Paste a full TikTok video link to add it to the feed"); }
  else if (app === "live") { const c = /twitch\.tv|kick\.com/.test(raw) ? chan(raw) : null; c ? go({ app, c }) : go({ app, find: raw }); }
  else if (app === "movies") { const id = ytId(raw); id ? go({ app, v: id }) : go({ ...mfState(), find: raw }); }
  else if (app === "theater" && f.dataset.s) {
    const sa = STREAM(f.dataset.s), pv = PROVIDERS[sa.kind], id = pv.link && pv.link(raw);
    id ? go({ app, s: sa.id, v: id, at: now() }) : go({ app, s: sa.id, find: raw });
  }
  else if (app === "theater" || app === "web") openWeb(raw);
});
/* mouse wheel: up/down always scrolls the page (even over a row of cards); sideways wheel or the ‹ › arrows move a row */
document.addEventListener("wheel", e => {
  if (Math.abs(e.deltaY) <= Math.abs(e.deltaX)) return;                     // sideways swipe: let the row handle it
  if (e.target.closest(".upnext")) return;                                   // the Up Next list scrolls itself
  const mini = e.target.closest(".mini-row");                                // the small Up Next strip in a player still scrolls sideways
  if (mini) { mini.scrollLeft += e.deltaY; e.preventDefault(); return; }
  const pg = e.target.closest(".appview");
  if (pg && pg.scrollHeight > pg.clientHeight + 2) {
    pg.style.scrollBehavior = "auto";
    pg.scrollTop += e.deltaMode === 1 ? e.deltaY * 40 : e.deltaY;           // line-mode wheels (some viewers) send small numbers
    pg.style.scrollBehavior = ""; e.preventDefault();
  }
}, { passive: false });
function rowArrows() {
  document.querySelectorAll(".track").forEach(tr => {
    if (!tr.dataset.arrows) {
      tr.dataset.arrows = 1;
      const w = document.createElement("div"); w.className = "trackwrap";
      tr.parentNode.insertBefore(w, tr); w.appendChild(tr);
      for (const d of [-1, 1]) {
        const b = document.createElement("button"); b.className = "tarrow " + (d < 0 ? "l" : "r");
        b.textContent = d < 0 ? "‹" : "›"; b.setAttribute("aria-label", d < 0 ? "Scroll left" : "Scroll right");
        b.addEventListener("click", ev => { ev.stopPropagation(); tr.scrollBy({ left: d * tr.clientWidth * 0.8, behavior: "smooth" }); });
        w.appendChild(b);
      }
      tr.addEventListener("scroll", () => arrowState(tr), { passive: true });
    }
    arrowState(tr);
  });
}
function arrowState(tr) {
  const w = tr.parentNode; if (!w || !w.classList.contains("trackwrap")) return;
  const max = tr.scrollWidth - tr.clientWidth;
  w.querySelector(".tarrow.l").hidden = max < 40 || tr.scrollLeft < 8;
  w.querySelector(".tarrow.r").hidden = max < 40 || tr.scrollLeft > max - 8;
}
let arrowT = 0;
new MutationObserver(() => { clearTimeout(arrowT); arrowT = setTimeout(rowArrows, 60); }).observe(document.getElementById("app"), { childList: true, subtree: true });
window.addEventListener("resize", rowArrows);

/* =====================================================================
   SOUND ENGINE  -  every sound is synthesized live, no files needed.
   Media-on-a-prim audio is heard by everyone looking at the TV.
   ===================================================================== */
const SFX = (() => {
  let ac = null, bus = null, verb = null;
  function ctx() {
    if (!CONFIG.sounds) return null;
    if (!ac) {
      try {
        ac = new (window.AudioContext || window.webkitAudioContext)();
        bus = ac.createGain(); bus.gain.value = CONFIG.volume;
        const comp = ac.createDynamicsCompressor(); comp.threshold.value = -14; comp.ratio.value = 4;
        bus.connect(comp); comp.connect(ac.destination);
        // small airy "room": two feedback delays into a lowpass
        verb = ac.createGain(); verb.gain.value = .22;
        const lp = ac.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 3800;
        [.113, .171].forEach(t => { const d = ac.createDelay(); d.delayTime.value = t; const fb = ac.createGain(); fb.gain.value = .42; verb.connect(d); d.connect(fb); fb.connect(d); d.connect(lp); });
        lp.connect(bus);
      } catch (e) { return null; }
    }
    if (ac.state === "suspended") ac.resume();
    return ac;
  }
  function tone(f, dur, o = {}) {
    const c = ctx(); if (!c) return;
    const t = c.currentTime + (o.delay || 0) + .01;
    const osc = c.createOscillator(), g = c.createGain();
    osc.type = o.type || "sine";
    osc.frequency.setValueAtTime(f, t);
    if (o.to) osc.frequency.exponentialRampToValueAtTime(o.to, t + (o.glide || dur));
    if (o.detune) osc.detune.value = o.detune;
    const v = o.vol ?? .2, a = o.attack ?? .004;
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(v, t + a);
    g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    osc.connect(g); g.connect(bus); if (o.wet !== 0) g.connect(verb);
    osc.start(t); osc.stop(t + dur + .05);
  }
  let nbuf = null;
  function noise(dur, o = {}) {
    const c = ctx(); if (!c) return;
    if (!nbuf) { nbuf = c.createBuffer(1, c.sampleRate, c.sampleRate); const d = nbuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }
    const t = c.currentTime + (o.delay || 0) + .01;
    const src = c.createBufferSource(); src.buffer = nbuf; src.loop = true;
    const bp = c.createBiquadFilter(); bp.type = o.ftype || "bandpass"; bp.Q.value = o.q ?? 1.2;
    bp.frequency.setValueAtTime(o.f || 1200, t);
    if (o.to) bp.frequency.exponentialRampToValueAtTime(o.to, t + dur);
    const g = c.createGain(), v = o.vol ?? .15, a = o.attack ?? .01;
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(v, t + a);
    g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    src.connect(bp); bp.connect(g); g.connect(bus); if (o.wet !== 0) g.connect(verb);
    src.start(t); src.stop(t + dur + .05);
  }
  let lastHover = 0;

    hover() { if (!CONFIG.hoverTicks) return; const n = performance.now(); if (n - lastHover < 70) return; lastHover = n;
      tone(2400, .045, { vol: .035, wet: 0 }); noise(.03, { f: 6000, q: 2, vol: .02, wet: 0 }); },
    click() { tone(1150, .07, { to: 900, vol: .14 }); noise(.04, { f: 3500, q: 1.5, vol: .06 }); },
    open() {  // app launch: airy whoosh + rising two-note
      noise(.55, { f: 380, to: 4200, q: .8, vol: .12, attack: .12 });
      tone(523.25, .5, { vol: .09, delay: .08 }); tone(783.99, .7, { vol: .08, delay: .18 }); tone(1046.5, .8, { vol: .04, delay: .26, type: "triangle" });
    },
    home() {  // back to home: soft settle
      noise(.45, { f: 3200, to: 500, q: .8, vol: .09, attack: .05 });
      tone(659.25, .45, { vol: .07, delay: .05 }); tone(493.88, .6, { vol: .07, delay: .14 });
    },
    play() {  // video starts
      tone(880, .18, { vol: .08 }); tone(1318.5, .35, { vol: .07, delay: .07 });
    },
    swipe(up) { noise(.28, { f: up ? 700 : 2600, to: up ? 2600 : 700, q: 1.4, vol: .1, attack: .03 }); },
    toast() { tone(1567.98, .12, { vol: .07 }); tone(2093, .25, { vol: .06, delay: .07 }); },
    error() { tone(311.13, .16, { type: "triangle", vol: .12 }); tone(233.08, .3, { type: "triangle", vol: .12, delay: .12 }); },
    sleep() { tone(783.99, .9, { vol: .05 }); tone(523.25, 1.2, { vol: .05, delay: .2 }); },
    wake()  { tone(523.25, .5, { vol: .05 }); tone(783.99, .7, { vol: .05, delay: .12 }); },
    boot() {  // power-on chord, arpeggiated with a sub
      const c = ctx(); if (!c) return;
      [[130.81, 0, .30, "sine"], [261.63, 0, .16, "sine"], [392.0, .09, .13, "sine"], [493.88, .18, .12, "sine"],
       [587.33, .27, .11, "sine"], [783.99, .38, .09, "triangle"], [1174.66, .52, .05, "sine"]].forEach(([f, d, v, ty]) => {
        tone(f, 3.4, { delay: d, vol: v, type: ty, attack: .04 }); tone(f * 1.003, 3.4, { delay: d, vol: v / 3, type: "triangle", attack: .04 });
      });
      noise(1.6, { f: 300, to: 6000, q: .6, vol: .06, attack: .6 });
    },
    shutdown() {  // power-off: CRT whine falling, thunk on collapse, shimmer for the sparks
      tone(1760, 2.0, { to: 90, glide: 1.95, vol: .06, type: "sawtooth", wet: 0 });     // the collapsing "whine"
      tone(880, 1.9, { to: 110, glide: 1.85, vol: .08, type: "triangle" });
      noise(1.95, { f: 5200, to: 160, q: .8, vol: .09 });
      tone(48, .7, { vol: .32, delay: 1.95, wet: 0 });                                   // thunk as it pinches to a dot
      noise(.14, { f: 2600, q: 1.2, vol: .12, delay: 1.95 });
      [2093, 2637, 3136, 3951, 4699].forEach((f, i) => tone(f, 2.2, { vol: .025, delay: 2.05 + i * .09, type: "sine" }));   // sparkle
      tone(523.25, 2.6, { vol: .05, delay: 2.9 }); tone(392, 3.0, { vol: .05, delay: 3.1 }); tone(261.6, 3.4, { vol: .04, delay: 3.35 });   // "see you soon"
    },
    unlock() { ctx(); }
  };
})();
function chime() { SFX.boot(); }

function runBoot(done) {
  const b = $("#boot"); b.classList.add("on"); document.body.classList.add("booting");
  const word = CONFIG.osName.split("").map((ch, i) => `<span style="animation-delay:${1.75 + i * .09}s">${esc(ch)}</span>`).join("");
  $(".word", b).innerHTML = word;
  const cv = $("canvas", b), ctx = cv.getContext("2d");
  const W = cv.width = innerWidth * devicePixelRatio, H = cv.height = innerHeight * devicePixelRatio;
  const cx = W / 2, cy = H * .45, R = Math.max(W, H);
  const N = 420, parts = [];
  for (let i = 0; i < N; i++) {
    const a = Math.random() * Math.PI * 2, d = R * (.35 + Math.random() * .6);
    parts.push({ a, d, s: .6 + Math.random() * 1.8, hue: 200 + Math.random() * 80, spin: (Math.random() < .5 ? -1 : 1) * (1.2 + Math.random() * 1.6), delay: Math.random() * .35 });
  }
  const start = performance.now(); let finished = false;
  const ease = t => 1 - Math.pow(1 - t, 3);
  function frame(ts) {
    const t = (ts - start) / 1000;
    ctx.fillStyle = "rgba(0,0,0,.28)"; ctx.fillRect(0, 0, W, H);
    ctx.globalCompositeOperation = "lighter";
    for (const p of parts) {
      let x, y, al;
      if (t < 1.35) {                          // converge in a spiral
        const k = ease(Math.min(1, Math.max(0, (t - p.delay) / (1.35 - p.delay))));
        const d = p.d * (1 - k), a = p.a + p.spin * k;
        x = cx + Math.cos(a) * d; y = cy + Math.sin(a) * d * .8; al = .25 + .75 * k;
      } else {                                  // burst outward + fade
        const k = ease(Math.min(1, (t - 1.35) / 1.6));
        const d = R * .55 * k * (p.s / 2.4), a = p.a + p.spin;
        x = cx + Math.cos(a) * d; y = cy + Math.sin(a) * d * .8; al = 1 - k;
      }
      if (al <= 0) continue;
      ctx.fillStyle = `hsla(${p.hue},100%,75%,${al})`;
      ctx.beginPath(); ctx.arc(x, y, p.s * devicePixelRatio, 0, 6.283); ctx.fill();
    }
    ctx.globalCompositeOperation = "source-over";
    if (t < 4.2 && !finished) requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  requestAnimationFrame(() => b.classList.add("go"));
  setTimeout(chime, 1100);
  const finish = () => {
    if (finished) return; finished = true;
    b.classList.add("out"); document.body.classList.remove("booting"); document.body.classList.add("booted");
    setTimeout(() => { b.classList.remove("on", "go", "out"); }, 950);
    done && done();
  };
  setTimeout(finish, 3900);
  b.addEventListener("click", finish);
}

/* =====================================================================
   ROUTER
   ===================================================================== */
function route() {
  const app = P.get("app") || "";
  const q = P.get("q") || "";
  document.body.className = app ? "theme-" + app : "";
  if (app === "tube") {
    const id = P.get("v") || ytId(q);
    if (id) return renderTubePlayer(id);
    const f = P.get("find") || q;
    return f ? renderTubeSearch(f) : renderTubeBrowse();
  }
  if (app === "loops") return renderHome();          // Loops (TikTok) was retired in v2.3
  if (app === "loops-old") {
    const id = P.get("id") || ttId(q);
    if (id) return renderLoopsPlayer(id);
    const f = P.get("find") || q;
    if (f) return renderLoopsBrowse("<b>That isn't a TikTok video link.</b> Paste the full <b>tiktok.com/@user/video/…</b> link (open short <b>vm.tiktok.com</b> links in a browser first) and it joins the feed.");
    if (P.get("view") === "all") return renderLoopsBrowse();
    const first = loopIds()[0];
    return first ? renderLoopsPlayer(first) : renderLoopsBrowse();
  }
  if (app === "apps") return renderAllApps();
  if (app === "music") {
    const st = P.get("st"), id = P.get("v") || ytId(q);
    if (st) return renderMusicPlayer(st, +P.get("i") || 0);
    if (id) return renderMusicPlayer("", 0, id);
    const f = P.get("find") || q;
    return f ? renderMusicSearch(f) : renderMusicBrowse();
  }
  if (app === "pulse") return renderHome();          // the Kick app was retired in v2.1
  if (app === "live") {
    const c = P.get("c") || (/twitch\.tv/.test(q) ? chan(q) : null);
    if (c) return renderChannelPlayer(app, c);
    const f = P.get("find") || q;
    return f ? renderLiveSearch(f) : renderChannelBrowse(app);
  }
  if (app === "movies") {
    const id = P.get("v") || ytId(q);
    if (id) return renderMoviePlayer(id);
    return (q || MF.some(k => P.get(k))) ? renderMoviesList() : renderMoviesBrowse();
  }
  if (app === "theater") {
    if (q) { const u = /^https?:\/\//i.test(q) ? q : "https://" + q; return location.replace(u); }
    const sa = STREAM(P.get("s") || "");
    if (sa && sa.kind === "frame") return renderStreamFrame(sa);
    if (sa && sa.kind === "goto") return go(sa.go);
    if (sa && PROVIDERS[sa.kind]) {
      const v = P.get("v"); if (v) return renderStreamPlayer(sa, v);
      const f = P.get("find"); if (f) return renderStreamSearch(sa, f);
      return renderStreamBrowse(sa);
    }
    return renderTheater();
  }
  if (app === "web") {
    if (q) return openWeb(q, true);
    return renderWeb();
  }
  if (app === "ambient") return renderAmbient();
  return renderHome();
}
/* ---------- SHUTDOWN (TV sends ?shutdown=<unix time> just before switching off) ---------- */
function renderShutdown(at) {
  document.body.className = "";
  $("#app").innerHTML = `<section class="view off" style="animation:none">
    <div class="crt"><div class="ghost"></div></div><div class="dot"></div><div class="ripple"></div><canvas></canvas>
    <div class="bye"><div class="orb-mini"></div><b>${esc(CONFIG.osName)}</b><small>See you soon</small></div></section>`;
  const off = $(".off");
  if (Math.abs(now() - at) > 20) { off.classList.add("done"); return; }   // late joiner: just stay dark
  SFX.shutdown();
  requestAnimationFrame(() => off.classList.add("go"));
  // sparks burst out of the dot as it flares
  const cv = $("canvas", off), c = cv.getContext("2d");
  const W = cv.width = innerWidth * devicePixelRatio, H = cv.height = innerHeight * devicePixelRatio;
  const parts = Array.from({ length: 170 }, () => {
    const a = Math.random() * Math.PI * 2, sp = (0.25 + Math.random() * 1.1) * Math.max(W, H) * 0.42;
    return { a, sp, s: (0.6 + Math.random() * 1.8) * devicePixelRatio, hue: 195 + Math.random() * 90, drift: (Math.random() - .5) * .9 };
  });
  const t0 = performance.now() + 2100;
  (function frame(ts) {
    const t = (ts - t0) / 1000;
    c.clearRect(0, 0, W, H);
    if (t > 0) {
      c.globalCompositeOperation = "lighter";
      for (const p of parts) {
        const k = 1 - Math.pow(1 - Math.min(1, t / 2.8), 3);          // ease-out
        const d = p.sp * k, a = p.a + p.drift * k;
        const x = W / 2 + Math.cos(a) * d, y = H / 2 + Math.sin(a) * d * .75;
        const al = Math.max(0, 1 - t / 3.0);
        c.fillStyle = `hsla(${p.hue},100%,78%,${al})`;
        c.beginPath(); c.arc(x, y, Math.max(0, p.s * (1 - t / 3.6)), 0, 6.283); c.fill();
      }
    }
    if (t < 3.1) requestAnimationFrame(frame); else c.clearRect(0, 0, W, H);
  })(performance.now());
}
const bootAt = +P.get("boot") || 0;
const offAt = +P.get("shutdown") || 0;
if (offAt) renderShutdown(offAt); else route();
/* entrance sound for whatever screen just loaded (everyone in the room hears it) */
if (!offAt && !bootAt) {
  const a = P.get("app");
  setTimeout(() => {
    if (!a) SFX.home();
    else if (P.get("v") || P.get("id") || P.get("c")) SFX.play();
    else SFX.open();
  }, 120);
}
if (!offAt && bootAt && (P.get("forceboot") || Math.abs(now() - bootAt) < 90)) runBoot();
if (bootAt) { try { const u = new URL(location.href); u.searchParams.delete("boot"); history.replaceState(null, "", u); } catch (e) {} }
</script>
