<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=520">
<title>lumen Pod</title>
<style>
:root{--body:#d6d9e0;--sheen:#eef0f4;--w1:#fbfbfc;--w2:#dcdde2;--c1:#e6e7eb;--c2:#c8c9cf;--ink:#8a8c94;--hi:#2f7cf6;--hi2:#5d9bff}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:var(--body);font-family:Inter,"Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-font-smoothing:antialiased;touch-action:none}
#pod{position:absolute;left:0;top:0;width:520px;height:920px;transform-origin:0 0;overflow:hidden;
  background:radial-gradient(75% 48% at 42% 36%,var(--sheen),var(--body) 72%)}
#bezel{position:absolute;left:1px;top:15px;width:518px;height:395px;border-radius:26px;background:#0b0b0e;padding:10px;
  box-shadow:0 1px 0 rgba(255,255,255,.35)}
#screen{position:relative;width:100%;height:100%;border-radius:16px;overflow:hidden;background:#f4f4f6;color:#111}
#bar{position:relative;z-index:3;height:50px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;
  background:linear-gradient(#fafafb,#dfe0e5);box-shadow:0 1px 0 #c3c4ca;font-size:24px;font-weight:700}
#bar .t{position:absolute;left:78px;right:78px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#bar svg{display:block}
#views{position:absolute;left:0;right:0;top:50px;bottom:0;overflow:hidden;z-index:1}
/* moving lights behind the screen, like the TV's wallpaper (Settings > Background) */
#bgfx{position:absolute;left:0;right:0;top:50px;bottom:0;overflow:hidden;z-index:0;background:#eceef3;display:none}
#screen.lights #bgfx{display:block}
#screen.dark #bgfx{background:#0a0b10}
#bgfx .bl{position:absolute;width:380px;height:380px;border-radius:50%;opacity:.8;will-change:transform;
  background:radial-gradient(closest-side,var(--c),transparent 70%)}
#screen.dark #bgfx .bl{opacity:.75}
#bgfx .b1{--c:var(--hi);left:-150px;top:-170px;animation:pd1 11s ease-in-out infinite alternate}
#bgfx .b2{--c:var(--w3,#00c2c7);right:-160px;top:-70px;animation:pd2 13s ease-in-out infinite alternate}
#bgfx .b3{--c:var(--hi2);left:30px;bottom:-230px;animation:pd3 12s ease-in-out infinite alternate}
#bgfx .b4{--c:var(--w4,#a23cff);right:-60px;bottom:-200px;width:300px;height:300px;opacity:.4;animation:pd4 9s ease-in-out infinite alternate}
@keyframes pd1{33%{transform:translate(160px,40px) scale(1.2)}66%{transform:translate(50px,150px) scale(.9)}to{transform:translate(210px,90px) scale(1.25)}}
@keyframes pd2{33%{transform:translate(-140px,130px) scale(.85)}66%{transform:translate(-40px,40px) scale(1.15)}to{transform:translate(-190px,150px) scale(.95)}}
@keyframes pd3{33%{transform:translate(170px,-90px) scale(1.3)}66%{transform:translate(-60px,-130px) scale(1)}to{transform:translate(220px,-40px) scale(1.2)}}
@keyframes pd4{50%{transform:translate(-170px,-120px) scale(1.25)}to{transform:translate(-280px,-30px) scale(.9)}}
.v{position:absolute;inset:0;background:#f4f4f6;transition:transform .22s ease;will-change:transform}
#screen.lights .v{background:rgba(246,246,249,.34)}
#screen.lights.dark .v{background:rgba(12,12,16,.45)}
#screen.lights .np .art{box-shadow:0 10px 26px rgba(0,0,0,.35)}
.list{position:absolute;inset:0;overflow:hidden}
.row{height:64px;display:flex;align-items:center;gap:14px;padding:0 18px;font-size:30px;font-weight:600;white-space:nowrap}
.row .l{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.row .l small{display:block;font-size:20px;font-weight:500;opacity:.7;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.row .val{font-size:24px;font-weight:600;color:#6b6d75}
.row.two{height:74px}
.row .art{width:52px;height:52px;border-radius:8px;flex:0 0 52px;background:#ccc center/cover no-repeat}
.row.sel{background:linear-gradient(var(--hi2),var(--hi));color:#fff}
.row.sel .val{color:#fff}
.row svg{flex:0 0 auto}
.empty{padding:26px 22px;font-size:24px;line-height:1.35;color:#555}
/* now playing */
.np{position:absolute;inset:0;padding:22px}
.np .art{position:absolute;left:22px;top:22px;width:170px;height:170px;border-radius:12px;background:#ddd center/cover no-repeat;
  box-shadow:0 10px 22px rgba(0,0,0,.28)}
.np .txt{position:absolute;left:212px;right:20px;top:22px;display:flex;flex-direction:column;gap:6px}
.np .cnt{font-size:20px;font-weight:600;color:#777}
.np .ti{font-size:30px;font-weight:800;line-height:1.12;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.np .ar{font-size:23px;font-weight:600;color:#444;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.np .st{font-size:19px;color:#777;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.np .prog{position:absolute;left:22px;right:22px;bottom:58px;height:12px;border-radius:6px;background:#d6d7dc;overflow:hidden;box-shadow:inset 0 1px 2px rgba(0,0,0,.15)}
.np .prog i{display:block;height:100%;width:0;background:linear-gradient(var(--hi2),var(--hi));border-radius:6px}
.np .tm{position:absolute;left:22px;right:22px;bottom:22px;display:flex;justify-content:space-between;font-size:21px;font-weight:600;color:#666}
.np .mode{position:absolute;left:0;right:0;bottom:22px;text-align:center;font-size:19px;font-weight:700;color:var(--hi)}
/* keyboard */
.kb{position:absolute;inset:0;padding:14px 16px}
.kb .q{height:52px;border-radius:10px;background:#fff;box-shadow:inset 0 0 0 2px #c9cad0;display:flex;align-items:center;gap:10px;padding:0 14px;font-size:26px;font-weight:600;overflow:hidden;white-space:nowrap}
.kb .q span{flex:1;overflow:hidden;text-overflow:ellipsis}
.kb .q .ph{color:#999;font-weight:500}
.kb .keys{display:grid;grid-template-columns:repeat(10,1fr);gap:6px;margin-top:10px}
.kb .k{height:46px;border-radius:8px;background:#fff;box-shadow:0 2px 0 #c3c4ca;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;color:#333}
.kb .k.w2{grid-column:span 2}
.kb .k.sel{background:linear-gradient(var(--hi2),var(--hi));color:#fff;box-shadow:0 2px 0 rgba(0,0,0,.25)}
.kb .hint{position:absolute;left:16px;right:16px;bottom:8px;font-size:16px;color:#777;text-align:center}
/* colour screen */
.cw{position:absolute;inset:0}
.cw .wb{position:absolute;left:16px;top:12px;width:220px;height:220px;border-radius:50%;box-shadow:0 0 0 3px #fff,0 0 0 4px #c9cad0,0 6px 16px rgba(0,0,0,.18);touch-action:none;cursor:crosshair}
.cw .wb.on{box-shadow:0 0 0 3px #fff,0 0 0 6px var(--hi),0 6px 16px rgba(0,0,0,.18)}
.cw canvas{display:block;width:220px;height:220px;border-radius:50%}
.cw .mk{position:absolute;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;border:4px solid #fff;box-shadow:0 0 0 1.5px rgba(0,0,0,.45),0 2px 6px rgba(0,0,0,.35);pointer-events:none}
.cw .br{position:absolute;left:16px;top:248px;width:220px;height:26px;border-radius:13px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.18);touch-action:none;cursor:pointer}
.cw .br.on{box-shadow:inset 0 0 0 1px rgba(0,0,0,.18),0 0 0 3px var(--hi)}
.cw .br .kn{position:absolute;top:50%;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;background:#fff;box-shadow:0 1px 5px rgba(0,0,0,.45);pointer-events:none}
.cw .side{position:absolute;left:254px;right:14px;top:10px}
.cw .sw{display:grid;grid-template-columns:repeat(3,1fr);gap:4px 6px}
.cw .s{display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;padding:4px 0;border-radius:12px}
.cw .s i{width:54px;height:54px;border-radius:50%;box-shadow:inset 0 0 0 2px rgba(0,0,0,.14),0 2px 5px rgba(0,0,0,.18);display:flex;align-items:center;justify-content:center;font-style:normal;font-size:26px;font-weight:800;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.5)}
.cw .s span{font-size:16px;font-weight:700;color:#444}
.cw .s.sel{background:rgba(0,0,0,.08);box-shadow:inset 0 0 0 3px var(--hi)}
.cw .cu{margin-top:8px;height:52px;border-radius:12px;display:flex;align-items:center;gap:10px;padding:0 12px;background:#fff;box-shadow:inset 0 0 0 1px #c9cad0;font-size:22px;font-weight:700;cursor:pointer}
.cw .cu i{width:30px;height:30px;border-radius:8px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.2)}
.cw .cu b{margin-left:auto;font-size:18px;font-weight:600;color:#666;font-family:ui-monospace,Menlo,Consolas,monospace}
.cw .cu.sel{background:linear-gradient(var(--hi2),var(--hi));color:#fff;box-shadow:none}
.cw .cu.sel b{color:#fff}
.cw .hint{position:absolute;left:254px;right:14px;bottom:12px;font-size:16px;line-height:1.3;color:#666}
.cw .hint b{color:var(--hi)}
/* dark screen (Settings > Screen) */
#screen.dark{background:#0e0e11;color:#f2f2f5}
#screen.dark #bar{background:linear-gradient(#2b2c31,#1b1c20);box-shadow:0 1px 0 #000;color:#f2f2f5}
#screen.dark .v{background:#0e0e11}
#screen.dark .row .val{color:#9a9ca6}
#screen.dark .row.sel .val{color:#fff}
#screen.dark .cw .s i{box-shadow:inset 0 0 0 2px rgba(255,255,255,.28),0 2px 5px rgba(0,0,0,.5)}
#screen.dark .row .art{background-color:#2a2b30}
#screen.dark .empty{color:#b5b7bf}
#screen.dark .np .art{background-color:#2a2b30;box-shadow:0 10px 22px rgba(0,0,0,.6)}
#screen.dark .np .cnt,#screen.dark .np .st{color:#8d8f98}
#screen.dark .np .ar{color:#c9cbd2}
#screen.dark .np .prog{background:#2d2e33;box-shadow:none}
#screen.dark .np .tm{color:#a3a5ad}
#screen.dark .kb .q{background:#1d1e22;box-shadow:inset 0 0 0 2px #34353b}
#screen.dark .kb .q .ph{color:#6f717a}
#screen.dark .kb .q svg path{stroke:#aaa}
#screen.dark .kb .k{background:#25262b;color:#e8e9ee;box-shadow:0 2px 0 #000}
#screen.dark .kb .k.sel{background:linear-gradient(var(--hi2),var(--hi));color:#fff}
#screen.dark .kb .hint,#screen.dark .cw .hint{color:#8d8f98}
#screen.dark .cw .wb{box-shadow:0 0 0 3px #0e0e11,0 0 0 4px #3a3b41,0 6px 16px rgba(0,0,0,.5)}
#screen.dark .cw .wb.on{box-shadow:0 0 0 3px #0e0e11,0 0 0 6px var(--hi)}
#screen.dark .cw .s span{color:#c9cbd2}
#screen.dark .cw .s.sel{background:rgba(255,255,255,.07)}
#screen.dark .cw .cu{background:#1d1e22;box-shadow:inset 0 0 0 1px #34353b}
#screen.dark .cw .cu b{color:#9a9ca6}
#screen.dark .cw .cu.sel{background:linear-gradient(var(--hi2),var(--hi));box-shadow:none}
#screen.dark .cw .cu.sel b{color:#fff}
/* overlays */
#vol{position:absolute;left:30px;right:30px;bottom:18px;z-index:5;padding:14px 18px;border-radius:14px;background:rgba(20,20,24,.82);color:#fff;
  display:flex;align-items:center;gap:14px;opacity:0;transition:opacity .2s;pointer-events:none}
#vol.on{opacity:1}
#vol .b{flex:1;height:10px;border-radius:5px;background:rgba(255,255,255,.25);overflow:hidden}
#vol .b i{display:block;height:100%;background:#fff}
#dim{position:absolute;inset:0;z-index:6;background:#000;opacity:0;pointer-events:none;transition:opacity .2s}
#toast{position:absolute;left:50%;top:62px;z-index:5;transform:translateX(-50%);padding:8px 16px;border-radius:12px;background:rgba(20,20,24,.85);color:#fff;
  font-size:20px;font-weight:600;white-space:nowrap;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.on{opacity:1}
/* nearby alert: drops down from the top of the screen */
#near{position:absolute;left:12px;right:12px;top:8px;z-index:7;display:flex;align-items:center;gap:14px;padding:12px 16px;border-radius:18px;
  background:rgba(22,22,26,.92);color:#fff;box-shadow:0 10px 30px rgba(0,0,0,.45);transform:translateY(-140%);opacity:0;
  transition:transform .45s cubic-bezier(.2,.9,.25,1.15),opacity .3s;pointer-events:none}
#near.on{transform:translateY(0);opacity:1}
#near .av{width:46px;height:46px;border-radius:50%;flex:0 0 46px;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(140deg,var(--hi2),var(--hi));font-size:22px;font-weight:800}
#near .tx{display:flex;flex-direction:column;min-width:0}
#near b{font-size:21px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#near span{font-size:16px;color:rgba(255,255,255,.72)}
#ytbox{position:absolute;left:33px;top:97px;width:170px;height:170px;border-radius:12px;overflow:hidden;opacity:0;pointer-events:none;z-index:4;transition:opacity .15s}
#ytbox.on{opacity:1;pointer-events:auto;cursor:zoom-in}
#ytbox #yt,#ytbox iframe{position:absolute;left:-66px;top:0;width:302px;height:170px;border:0}
#ytbox::after{content:"";position:absolute;inset:0}                 /* small view: a click makes it big */
#ytbox .cap{display:none}
/* big video: the whole player, clickable, so YouTube's own "Skip Ad" button can be pressed */
#ytbox.big{left:11px;top:75px;width:498px;height:325px;border-radius:0 0 16px 16px;background:#000;cursor:default}
#ytbox.big::after{display:none}
#ytbox.big #yt,#ytbox.big iframe{left:0;top:0;width:498px;height:280px}
#ytbox.big .cap{display:block;position:absolute;left:0;right:0;bottom:0;height:45px;line-height:45px;text-align:center;white-space:nowrap;
  font-size:17px;font-weight:600;color:#ddd;background:#111}
#ytbox.big .cap b{color:#fff}
/* the click wheel */
#wheel{position:absolute;left:45px;top:460px;width:430px;height:430px;border-radius:50%;background:linear-gradient(160deg,var(--w1),var(--w2));
  box-shadow:inset 0 3px 10px rgba(0,0,0,.16),0 1px 0 rgba(255,255,255,.45);cursor:pointer;touch-action:none}
#wheel .lab{position:absolute;color:var(--ink);font-weight:800;pointer-events:none}
#wheel .menu{top:34px;left:50%;transform:translateX(-50%);font-size:31px;letter-spacing:.08em}
#wheel .prev{left:36px;top:50%;margin-top:-17px}
#wheel .next{right:36px;top:50%;margin-top:-17px}
#wheel .play{bottom:36px;left:50%;margin-left:-25px}
#ok{position:absolute;left:138px;top:138px;width:154px;height:154px;border-radius:50%;background:linear-gradient(160deg,var(--c1),var(--c2));
  box-shadow:0 2px 6px rgba(0,0,0,.2),inset 0 1px 0 rgba(255,255,255,.5)}
#wheel.press-ok #ok{filter:brightness(.92)}
/* worn copy (display only) */
.idle{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
  background:radial-gradient(120% 120% at 0% 0%,var(--hi2),transparent 60%),radial-gradient(120% 120% at 100% 100%,#141418,#0b0b0e);color:#fff}
.idle b{font-size:64px;font-weight:800;letter-spacing:-.03em}
.idle span{font-size:24px;opacity:.75}
</style>
</head>
<body>
<div id="pod">
  <div id="bezel"><div id="screen">
    <div id="bar"><span id="barL"></span><span class="t" id="title">lumen</span><span id="barR"></span></div>
    <div id="bgfx" aria-hidden="true"><div class="bl b1"></div><div class="bl b2"></div><div class="bl b3"></div><div class="bl b4"></div></div>
    <div id="views"></div>
    <div id="vol"><svg width="26" height="26" viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z" fill="#fff"/></svg><div class="b"><i></i></div>
      <svg width="30" height="26" viewBox="0 0 28 24"><path d="M3 9h4l5-4v14l-5-4H3z M16 8a5 5 0 0 1 0 8 M19 5a9 9 0 0 1 0 14" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg></div>
    <div id="toast"></div>
    <div id="near" role="status" aria-live="polite"><div class="av"></div><div class="tx"><b></b><span></span></div></div>
    <div id="dim"></div>
  </div></div>
  <div id="ytbox"><div id="yt"></div><div class="cap">Ad? Click <b>Skip</b> on the video · <b>MENU</b> to go back</div></div>
  <div id="wheel">
    <div class="lab menu">MENU</div>
    <svg class="lab prev" width="48" height="34" viewBox="0 0 26 18"><path d="M12 2v14L3 9z M23 2v14l-9-7z" fill="currentColor"/></svg>
    <svg class="lab next" width="48" height="34" viewBox="0 0 26 18"><path d="M3 2v14l9-7z M14 2v14l9-7z" fill="currentColor"/></svg>
    <svg class="lab play" width="50" height="34" viewBox="0 0 26 18"><path d="M3 2v14l8-7z M15 2h3v14h-3z M20 2h3v14h-3z" fill="currentColor"/></svg>
    <div id="ok"></div>
  </div>
</div>

  { key: "hits", name: "Today's Hits", g1: "#ff3d6e", g2: "#7a1cff", songs: [

async function search(q) {

  let pref = ""; try { pref = localStorage.getItem("lumenPodSrv") || ""; } catch (e) {}

  for (const f of filters) for (const base of servers) {
    try {
      const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), 7000);
      const r = await fetch(`${base}/search?q=${encodeURIComponent(q)}&filter=${f}`, { signal: ctl.signal });
      clearTimeout(t); if (!r.ok) continue;
      const j = await r.json();
      const items = (j.items || []).filter(x => x.url && /watch\?v=/.test(x.url) && !x.isShort)
        .map(x => ({ id: x.url.split("v=")[1].slice(0, 11), title: x.title || "", sub: (x.uploaderName || "").replace(/ - Topic$/, "") }));
      if (items.length) { try { localStorage.setItem("lumenPodSrv", base); } catch (e) {} return items; }
    } catch (e) { /* next server */ }
  }
  throw new Error("busy");
}

}
function colorSelect(v) {
  if (v.sel < 6 && !v.mode) { setColor(PRESETS[v.sel], true); colorSync(v); colorPaint(v); return; }
  v.sel = 6;
  v.mode = { h: "s", s: "b", b: null }[v.mode] || (v.mode ? null : "h");
  if (v.mode === "h" && v.s < 0.08) v.s = 0.6;   // starting from silver/black: give it some colour to turn
  if (v.mode === "h") colorCustom(v); else colorPaint(v);
}
// click and drag on the colour circle or the brightness bar
document.addEventListener("pointerdown", e => {
  const v = view(); if (v.type !== "color" || MODE === "worn") return;
  const wb = e.target.closest(".cw .wb"), br = e.target.closest(".cw .br"); if (!wb && !br) return;
  e.preventDefault(); e.stopPropagation();
  const pick = ev => {
    const r = (wb || br).getBoundingClientRect();
    if (wb) {
      const dx = (ev.clientX - r.left) / r.width * 2 - 1, dy = (ev.clientY - r.top) / r.height * 2 - 1;
      v.h = (Math.atan2(dy, dx) * 180 / Math.PI + 360) % 360; v.s = clamp(Math.hypot(dx, dy), 0, 1);
      if (v.b < 0.15) v.b = 1;
    } else v.b = clamp((ev.clientX - r.left) / r.width, 0, 1);
    v.sel = 6; colorCustom(v);
  };
  pick(e);
  const mv = ev => pick(ev), up = () => { removeEventListener("pointermove", mv); removeEventListener("pointerup", up); tick(); };
  addEventListener("pointermove", mv); addEventListener("pointerup", up);
}, true);
function screenMode() {
  $("#screen").classList.toggle("dark", S.screen === "Dark");
  $("#screen").classList.toggle("lights", S.bg !== "Plain");
}
function bright() { $("#dim").style.opacity = { High: 0, Medium: .22, Low: .45 }[S.bright] || 0; }

/* ---- drawing ---- */
function drawBar() {
  const t = view();
  $("#title").textContent = t.type === "np" ? (t.big ? "Video" : "Now Playing") : (t.title || "lumen");
  $("#barL").innerHTML = cur ? (playing
    ? `<svg width="22" height="24" viewBox="0 0 10 12"><path d="M1 1v10l8-5z" fill="currentColor"/></svg>`
    : `<svg width="22" height="24" viewBox="0 0 10 12"><path d="M1 1h3v10H1z M6 1h3v10H6z" fill="currentColor"/></svg>`) : "";
  $("#barR").innerHTML = `<svg width="46" height="22" viewBox="0 0 46 22"><rect x="1" y="2" width="38" height="18" rx="4" fill="none" stroke="currentColor" stroke-width="2"/><rect x="40" y="7" width="4" height="8" rx="1.5" fill="currentColor"/><rect x="4" y="5" width="30" height="12" rx="2" fill="#3ec45a"/></svg>`;
}
function listHTML(v) {
  if (!v.items.length) return `<div class="empty">${v.empty || "Nothing here."}</div>`;
  return `<div class="list"><div class="in">` + v.items.map((it, i) => {
    const s = i === v.sel, ink = s ? "#fff" : "#9a9ca3";
    const art = it.img ? `<span class="art" style="background-image:url('${esc(it.img)}')"></span>` : it.art ? `<span class="art" style="background:${it.art}"></span>`
      : it.swatch ? `<span class="art" style="background:${it.swatch};border-radius:50%;width:36px;height:36px;flex-basis:36px;box-shadow:inset 0 0 0 2px rgba(0,0,0,.15)"></span>` : "";
    return `<div class="row${it.small ? " two" : ""}${s ? " sel" : ""}">${art}<span class="l">${esc(it.label)}${it.small ? `<small>${esc(it.small)}</small>` : ""}</span>` +
      (it.val ? `<span class="val">${esc(it.val)}</span>` : "") + (it.go ? CHEV(ink) : "") + `</div>`;
  }).join("") + `</div></div>`;
}
function scrollSel(el, v) {
  const inn = el.querySelector(".in"); if (!inn) return;
  const rows = inn.children, box = el.querySelector(".list").clientHeight;
  let y = 0; for (let i = 0; i < v.sel; i++) y += rows[i].offsetHeight;
  const h = rows[v.sel] ? rows[v.sel].offsetHeight : 64;
  v.scroll = v.scroll || 0;
  if (y < v.scroll) v.scroll = y; else if (y + h > v.scroll + box) v.scroll = y + h - box;
  inn.style.transform = `translateY(${-v.scroll}px)`;
}
const KEYS = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789".split("").concat(["⌫", "space", "Search"]);
function kbHTML(v) {
  return `<div class="kb"><div class="q"><svg width="22" height="22" viewBox="0 0 24 24"><path d="M11 4a7 7 0 1 0 0 14a7 7 0 1 0 0-14z M20 20l-4-4" fill="none" stroke="#555" stroke-width="2.6" stroke-linecap="round"/></svg>` +
    `<span>${v.q ? esc(v.q) : `<i class="ph">song or artist</i>`}</span></div><div class="keys">` +
    KEYS.map((k, i) => `<div class="k${k === "Search" ? " w2" : ""}${i === v.k ? " sel" : ""}">${k === "space" ? "␣" : esc(k)}</div>`).join("") +
    `</div><div class="hint">Wheel = pick · middle = type · or use your keyboard</div></div>`;
}
function npHTML() {
  if (!cur) return `<div class="empty">Nothing playing. Press MENU and pick a station.</div>`;
  return `<div class="np"><div class="art" style="background-image:url('${esc(thumb(cur.id))}')"></div>
    <div class="txt"><div class="cnt">${Q.i + 1} of ${Q.list.length}</div><div class="ti">${esc(cur.title)}</div><div class="ar">${esc(cur.sub)}</div><div class="st">${esc(Q.from)}</div></div>
    <div class="prog"><i id="pbar"></i></div><div class="tm"><span id="tnow">0:00</span><span id="tleft">-0:00</span></div>
    ${view().scrub ? `<div class="mode">Scrubbing · turn the wheel</div>` : ""}</div>`;
}
function drawNP() { const el = $("#views .v:last-child"); if (el) el.innerHTML = npHTML(); progress(); }
function viewHTML(v) { return v.type === "np" ? npHTML() : v.type === "kb" ? kbHTML(v) : v.type === "color" ? colorHTML(v) : listHTML(v); }

let anim = false;
function render(dir) {
  const v = view(), box = $("#views");
  const el = document.createElement("div"); el.className = "v"; el.innerHTML = viewHTML(v);
  const old = box.querySelector(".v:last-child");
  if (dir && old) {
    el.style.transform = `translateX(${dir > 0 ? 100 : -100}%)`; box.appendChild(el);
    el.getBoundingClientRect();
    el.style.transform = "translateX(0)"; old.style.transform = `translateX(${dir > 0 ? -100 : 100}%)`;
    anim = true; setTimeout(() => { old.remove(); anim = false; ytShow(); }, 230);
  } else { box.innerHTML = ""; box.appendChild(el); }
  if (v.type === "list") scrollSel(el, v);
  drawBar(); ytShow(); if (v.type === "np") progress();
  if (v.type === "color") colorPaint(v);
  mirrorSoon();
}
function ytShow() {
  const v = view(), on = v.type === "np" && !!cur && !anim && MODE !== "worn";
  $("#ytbox").classList.toggle("on", on);
  $("#ytbox").classList.toggle("big", on && !!v.big);
  if (v.type === "np") $("#title").textContent = v.big ? "Video" : "Now Playing";
}
function bigVideo(on) { const v = view(); if (v.type !== "np") return; v.big = on; v.scrub = false; tick(true); ytShow(); }
$("#ytbox").addEventListener("click", () => { if (!view().big) bigVideo(true); });
function go(v) {
  if (typeof v === "function") v = v();
  if (v.type === "np" && view().type === "np") { render(); return; }
  stack.push(v); render(1);
}
function back() {
  if (stack.length > 1) { stack.pop(); const t = view(); if (t.refresh) t.refresh(); render(-1); }
  else if (cur) go({ type: "np" });
}

/* ---- the wheel's buttons ---- */
let volT = 0;
function showVol() {
  $("#vol .b i").style.width = S.vol + "%"; $("#vol").classList.add("on");
  clearTimeout(volT); volT = setTimeout(() => $("#vol").classList.remove("on"), 1300);
}
let toastT = 0;
function toast(t) { const el = $("#toast"); el.textContent = t; el.classList.add("on"); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove("on"), 1600); }

function step(d) {
  const v = view();
  if (v.type === "list") {
    if (!v.items.length) return;
    const n = Math.max(0, Math.min(v.items.length - 1, v.sel + d));
    if (n === v.sel) return;
    v.sel = n; tick(); render();
  } else if (v.type === "kb") {
    v.k = (v.k + d + KEYS.length) % KEYS.length; tick(); render();
  } else if (v.type === "color") {
    tick(); colorStep(v, d);
  } else if (v.type === "np") {
    tick();
    if (v.scrub && ytReady && cur) { yt.seekTo(Math.max(0, yt.getCurrentTime() + d * 5), true); progress(); }
    else { S.vol = Math.max(0, Math.min(100, S.vol + d * 5)); save(); if (ytReady) yt.setVolume(S.vol); showVol(); }
  }
}
function select() {
  tick(true);
  const v = view();
  if (v.type === "list") {
    const it = v.items[v.sel]; if (!it) return;
    if (it.act) it.act(); else if (it.go) go(it.go);
  } else if (v.type === "kb") {
    const k = KEYS[v.k];
    if (k === "⌫") v.q = v.q.slice(0, -1);
    else if (k === "space") v.q += " ";
    else if (k === "Search") return runSearch(v.q);
    else v.q += k.toLowerCase();
    render();
  } else if (v.type === "np") {
    if (v.big) bigVideo(false);
    else if (v.scrub) { v.scrub = false; drawNP(); if (cur) bigVideo(true); }
    else { v.scrub = true; drawNP(); }
  }
  else if (v.type === "color") colorSelect(v);
}
async function runSearch(q) {
  q = q.trim(); if (!q) { toast("Type a song or artist first"); return; }
  const v = { type: "list", title: "Results", items: [], sel: 0, empty: "Searching for “" + esc(q) + "”…" };
  go(v);
  try {
    const items = await search(q);
    v.items = items.map((s, i) => ({ label: s.title, small: s.sub, img: thumb(s.id), act: () => playList(items, i, "Search: " + q) }));
    v.empty = "No results for that one.";
  } catch (e) { v.empty = "Couldn't search right now. Give it a few seconds and try again."; }
  if (view() === v) render();
}
function press(zone) {
  if (zone === "menu") {
    tick(true); const v = view();
    if (v.type === "color" && v.mode) { v.mode = null; colorPaint(v); }
    else if (v.type === "np" && v.big) bigVideo(false);
    else back();
  }
  else if (zone === "next") { tick(true); next(false); }
  else if (zone === "prev") { tick(true); prev(); }
  else if (zone === "play") { tick(true); playPause(); }
  else if (zone === "ok") select();
}

/* ---- wheel input: drag around the ring, click its labels, or use the mouse wheel / keyboard ---- */
const W = $("#wheel");
let drag = null;
function polar(e) {
  const r = W.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  const dx = e.clientX - cx, dy = e.clientY - cy;
  return { a: Math.atan2(dy, dx) * 180 / Math.PI, d: Math.hypot(dx, dy) / (r.width / 2) };
}
W.addEventListener("pointerdown", e => {
  if (MODE === "worn") return;
  e.preventDefault();
  const p = polar(e);
  if (AC && AC.state === "suspended") AC.resume();
  if (p.d < 0.36) { W.classList.add("press-ok"); drag = { ok: true }; }
  else drag = { a: p.a, acc: 0, moved: 0, start: p };
  try { W.setPointerCapture(e.pointerId); } catch (x) {}
});
W.addEventListener("pointermove", e => {
  if (!drag || drag.ok) return;
  const p = polar(e); let d = p.a - drag.a;
  if (d > 180) d -= 360; if (d < -180) d += 360;
  drag.a = p.a; drag.acc += d; drag.moved += Math.abs(d);
  while (drag.acc >= 22) { drag.acc -= 22; step(1); }
  while (drag.acc <= -22) { drag.acc += 22; step(-1); }
});
function endDrag() {
  if (!drag) return;
  const dr = drag; drag = null; W.classList.remove("press-ok");
  if (dr.ok) { press("ok"); return; }
  if (dr.moved < 9) {
    const a = dr.start.a;   // 0 = right, 90 = down
    press(a > -135 && a < -45 ? "menu" : a >= -45 && a <= 45 ? "next" : a > 45 && a < 135 ? "play" : "prev");
  }
}
W.addEventListener("pointerup", endDrag);
W.addEventListener("pointercancel", () => { drag = null; W.classList.remove("press-ok"); });
let wAcc = 0;
addEventListener("wheel", e => {
  e.preventDefault(); if (MODE === "worn") return;
  wAcc += e.deltaY;
  while (wAcc >= 50) { wAcc -= 50; step(1); }
  while (wAcc <= -50) { wAcc += 50; step(-1); }
}, { passive: false });
$("#screen").addEventListener("click", e => {   // tapping a row on the screen works too
  if (MODE === "worn") return;
  const v = view(), row = e.target.closest(".row"), key = e.target.closest(".k");
  if (row && v.type === "list") { const i = [...row.parentNode.children].indexOf(row); if (i >= 0) { v.sel = i; render(); select(); } }
  else if (key && v.type === "kb") { v.k = [...key.parentNode.children].indexOf(key); select(); }
  else if (v.type === "color") { const c = e.target.closest(".s, .cu"); if (c) { v.mode = null; v.sel = +c.dataset.i; tick(true); colorSelect(v); } }
});
addEventListener("keydown", e => {
  if (MODE === "worn") return;
  const v = view();
  if (v.type === "kb" && e.key.length === 1 && !e.ctrlKey && !e.metaKey) { v.q += e.key; render(); e.preventDefault(); return; }
  if (v.type === "kb" && e.key === "Backspace") { v.q = v.q.slice(0, -1); render(); e.preventDefault(); return; }
  if (v.type === "kb" && e.key === "Enter") { runSearch(v.q); e.preventDefault(); return; }
  const k = { ArrowDown: () => step(1), ArrowUp: () => step(-1), Enter: select, Escape: () => press("menu"), Backspace: () => press("menu"),
    ArrowRight: () => press("next"), ArrowLeft: () => press("prev"), " ": () => press("play") }[e.key];
  if (k) { e.preventDefault(); k(); }
});

/* ---- progress ---- */
function progress() {
  if (view().type !== "np" || !cur) return;
  let t = 0, d = 0;
  if (MODE === "worn") { if (!mirP) return; d = mirP.dur; t = Math.min(d || 1e9, mirP.pos + (mirP.on ? (Date.now() - mirP.at) / 1000 : 0)); }
  else { if (!ytReady || !yt.getDuration) return; t = yt.getCurrentTime() || 0; d = yt.getDuration() || 0; }
  const b = $("#pbar");
  if (!b) return;
  b.style.width = d ? (100 * t / d) + "%" : "0";
  $("#tnow").textContent = fmt(t); $("#tleft").textContent = "-" + fmt(d - t);
}
setInterval(progress, 500);

/* ================= mirror: the hand Pod copies this screen =================
   The HUD page sends a small picture of its screen (which menu, which row, the song, progress, colour)
   to the Pod's script, which passes it to your hand Pod, whose page draws the same screen. */
const b64e = t => btoa(unescape(encodeURIComponent(t)));
const b64d = t => decodeURIComponent(escape(atob(t)));
const cut = (t, n) => { t = String(t || ""); return t.length > n ? t.slice(0, n - 1) + "…" : t; };
let mirT = 0, mirLast = "";
function mirrorSoon() { if (MODE === "worn") return; clearTimeout(mirT); mirT = setTimeout(sendMirror, 450); }
function mirrorState() {
  const v = view(), k = colorKey(S.color);
  const m = { v: v.type || "list", c: k ? k.toLowerCase() : (normHex(S.color) || "").slice(1), d: S.screen === "Dark" ? 1 : 0, b: S.bg === "Plain" ? 0 : 1, r: S.bright };
  if (v.type === "list") {
    const n = (v.items || []).length, a = Math.max(0, Math.min((v.sel || 0) - 2, n - 6));
    m.t = cut(v.title, 18); m.a = a; m.s = (v.sel || 0) - a;
    m.i = (v.items || []).slice(a, a + 6).map(it => [cut(it.label, 22), cut(it.small || "", 18), cut(it.val || "", 10), it.go ? 1 : 0]);
    if (!n) m.e = cut(String(v.empty || "").replace(/<[^>]+>/g, " "), 80);
  } else if (v.type === "kb") { m.q = cut(v.q, 24); m.k = v.k; }
  else if (v.type === "color") { m.s = v.sel; }
  if (cur) {
    let pos = 0, dur = 0;
    try { pos = ytReady ? yt.getCurrentTime() || 0 : 0; dur = ytReady ? yt.getDuration() || 0 : 0; } catch (e) {}
    m.n = [cur.id, cut(cur.title, 40), cut(cur.sub, 30), cut(Q.from, 24), Q.i + 1, Q.list.length];
    m.p = [Math.round(pos), Math.round(dur), playing ? 1 : 0];
  }
  return JSON.stringify(m);
}
function sendMirror() {
  if (MODE === "worn" || !CB) return;
  let enc = b64e(mirrorState());
  if (enc.length > 760) return;                 // keeps the address the hand Pod shows under SL's limit
  if (enc === mirLast) return;
  mirLast = enc;
  fetch(CB, { method: "POST", mode: "no-cors", body: "m=" + enc }).catch(() => { mirLast = ""; });
}
setInterval(() => { if (playing) mirrorSoon(); }, 15000);   // keep the hand Pod's progress bar honest

/* ---- hand Pod side: draw what the HUD Pod shows ---- */
let mirP = null;
function applyMirror(enc) {
  let m; try { m = JSON.parse(b64d(enc)); } catch (e) { return; }
  if (m.c) setColor(m.c, false);
  S.screen = m.d ? "Dark" : "Light"; S.bg = m.b ? "Lights" : "Plain"; if (m.r) S.bright = m.r;
  $("#bar").style.display = ""; $("#views").style.top = "";
  screenMode(); bright();
  if (m.n) { cur = { id: m.n[0], title: m.n[1], sub: m.n[2] }; Q.from = m.n[3]; Q.i = m.n[4] - 1; Q.list = new Array(m.n[5]).fill(cur); }
  playing = !!(m.p && m.p[2]);
  mirP = m.p ? { pos: m.p[0], dur: m.p[1], on: !!m.p[2], at: Date.now() } : null;
  let v;
  if (m.v === "np" && cur) v = { type: "np" };
  else if (m.v === "kb") v = { type: "kb", title: "Search", q: m.q || "", k: m.k || 0 };
  else if (m.v === "color") { v = colorView(); v.sel = m.s; }
  else v = { type: "list", title: m.t || "lumen", sel: m.s || 0, empty: m.e || "",
             items: (m.i || []).map(x => ({ label: x[0], small: x[1], val: x[2], go: x[3] ? () => ({}) : null })) };
  stack.length = 0; stack.push(v); render();
}

/* ================= worn copy: shows the song, never plays ================= */
function wornScreen() {
  const np = (P.get("np") || "").split("|"), title = np[0] || "", artist = np[1] || "";
  $("#bar").style.display = "none"; $("#views").style.top = "0";
  $("#views").innerHTML = title
    ? `<div class="idle" style="align-items:flex-start;justify-content:flex-end;padding:28px"><span style="font-size:22px;font-weight:700;opacity:.8">♪ Now Playing</span>
        <b style="font-size:40px;line-height:1.1">${esc(title)}</b><span>${esc(artist)}</span></div>`
    : `<div class="idle"><b>lumen</b><span>Pod</span></div>`;
}

/* ================= start ================= */
setColor(P.get("c") && (colorKey(P.get("c")) || normHex(P.get("c"))) ? P.get("c") : S.color, false);
bright(); screenMode();
if (MODE === "worn") { wornScreen(); readIn(); }
else {
  stack.push(mainMenu()); render();
  loadYT(); readIn();
}
</script>
</body>
</html>
